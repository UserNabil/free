/* --- historique de paie : la seule source de vérité sur mon salaire réel --- */
function statsPaie() {
  const li = Store.all("payslips").slice().sort((a, b) => String(a.mois).localeCompare(String(b.mois)));
  if (!li.length) return null;
  const douze = li.slice(-12);
  const s = (k) => douze.reduce((a, x) => a + nz(x[k]), 0);
  const brut = s("brut"), net = s("netPaye"), cout = s("coutGlobal");
  return {
    tout: li, douze, brut, net, cout,
    brutMoyen: brut / douze.length, netMoyen: net / douze.length,
    ratioNet: brut > 0 ? net / brut : 0,
    ratioBrutCout: cout > 0 ? brut / cout : 0,
    debut: douze[0].mois, fin: douze[douze.length - 1].mois
  };
}

function blocPaie(S) {
  const st = statsPaie();
  if (!st) {
    return '<details class="panel"><summary class="panel-h"><span class="chev">&#9656;</span>'
      + "<h2>Mon historique de paie</h2>"
      + '<span class="xs dim" style="flex:1">aucune fiche enregistrée</span>'
      + '<span class="btn sm" data-act="paie-new">+ Fiche</span></summary>'
      + '<div class="panel-b"><p class="note">Enregistrez vos bulletins pour que le simulateur travaille sur votre salaire '
      + "<b>réel</b> plutôt que sur une estimation : le brut des 12 derniers mois pilote directement le calcul de l'ARE.</p></div></details>";
  }
  const maxBrut = Math.max(...st.douze.map((x) => nz(x.brut)), 1);
  const ecartRef = nz(S.salaireNetMensuel) > 0 ? (st.netMoyen - nz(S.salaireNetMensuel)) / nz(S.salaireNetMensuel) : null;

  return '<details class="panel" id="panPaie"' + (localStorage_get("paieOpen") === "1" ? " open" : "") + ">"
    + '<summary class="panel-h"><span class="chev">&#9656;</span>'
    + "<h2>Mon historique de paie</h2>"
    + '<span class="pill">' + st.tout.length + " fiches</span>"
    + '<span class="xs dim" style="flex:1">' + esc(fmtMonth(st.debut)) + " → " + esc(fmtMonth(st.fin)) + "</span>"
    + '<span class="btn sm" data-act="paie-new">+ Fiche</span>'
    + '<span class="btn sm primary" data-act="paie-report">Utiliser ces chiffres</span></summary>'
    + '<div class="kpis" style="border:0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0">'
    + kpi(eur(st.brut), "Brut sur 12 mois", "base du calcul ARE")
    + kpi(eur(st.netMoyen), "Net payé / mois", "moyenne réelle")
    + kpi(pct(st.ratioNet, 1), "Net / brut", "ce qui arrive vraiment")
    + kpi(eur(st.cout), "Coût employeur", "ce que vous coûtez")
    + "</div>"
    + '<div class="scroll-x"><table><thead><tr><th>Mois</th><th class="tnum">Brut</th><th class="tnum">Net imposable</th>'
    + '<th class="tnum">Net payé</th><th style="min-width:120px">Brut</th></tr></thead><tbody>'
    + st.douze.slice().reverse().map((x) => "<tr>"
      + "<td>" + esc(fmtMonth(x.mois)) + "</td>"
      + '<td class="tnum">' + eur2(nz(x.brut)) + "</td>"
      + '<td class="tnum">' + (nz(x.netImposable) ? eur2(nz(x.netImposable)) : "—") + "</td>"
      + '<td class="tnum"><b>' + (nz(x.netPaye) ? eur2(nz(x.netPaye)) : "—") + "</b></td>"
      + '<td><div class="bar"><i style="width:' + Math.round(nz(x.brut) / maxBrut * 100) + '%"></i></div></td>'
      + '<td class="tnum"><button class="btn sm ghost" data-act="paie-edit" data-id="' + x.id + '">Modifier</button></td>'
      + "</tr>").join("")
    + "</tbody></table></div>"
    + '<div class="panel-b" style="border-top:2px solid var(--line);display:flex;flex-direction:column;gap:9px">'
    + '<p class="note acc"><b>Ce que ça change.</b> Le brut réel des 12 derniers mois (' + eur(st.brut)
    + ") intègre primes et réintégrations, il dépasse donc le simple salaire de base × 12. C'est ce montant qui doit servir de "
    + "salaire de référence pour l'ARE, et c'est le net payé moyen (" + eur(st.netMoyen)
    + ") qu'il faut comparer au revenu freelance — pas un net théorique."
    + (ecartRef !== null && Math.abs(ecartRef) > 0.02
      ? " Votre référence saisie dans les réglages (" + eur(nz(S.salaireNetMensuel)) + ") s'en écarte de "
        + '<b class="delta ' + (ecartRef > 0 ? "neg" : "pos") + '">' + (ecartRef > 0 ? "−" : "+") + pct(Math.abs(ecartRef), 0)
        + "</b> : le bouton « Utiliser ces chiffres » la corrige."
      : "")
    + "</p></div></details>";
}

/* --- simulateur ARE : du salaire brut à la date du premier paiement --- */
function blocARE(S) {
  const r = simulerARE(S);
  const A = S.params.aides.are;
  const pret = r.brutJour > 0 && r.duree > 0;

  const entrees = '<div class="panel-b" style="border-bottom:2px solid var(--line)">'
    + '<div class="eyebrow" style="margin-bottom:9px">Mes données de rupture</div>'
    + '<div class="grid-2" style="gap:11px">'
    + field("dateEntreeEntreprise", "Date d'entrée dans l'entreprise", "date", S.dateEntreeEntreprise,
      "connue : elle figure sur votre contrat et sur vos fiches de paie", null,
      "Elle fixe votre ancienneté, donc la durée d'indemnisation et le plancher légal de l'indemnité de rupture. Si vous la laissez vide, l'application prend la plus ancienne de vos fiches de paie.")
    + field("dateFinContrat", "Date de fin de contrat envisagée", "date", S.dateFinContrat,
      "à vous de la fixer — vide, l'ancienneté est arrêtée à aujourd'hui", null,
      "En rupture conventionnelle, les deux parties fixent librement cette date dans la convention : il n'y a pas de préavis. C'est elle qui sert de point de départ aux différés, donc à la date du premier versement de l'ARE.")
    + field("salaireBrut12Mois", "Salaire brut des 12 derniers mois", "number", S.salaireBrut12Mois,
      "repris de vos fiches de paie — 0 pour utiliser le salaire brut annuel (" + eur(nz(S.salaireBrutAnnuel)) + ")", "0.01",
      "France Travail calcule votre allocation sur les rémunérations brutes des douze derniers mois, primes comprises. C'est pour cela que ce montant dépasse le simple salaire de base multiplié par douze.")
    + field("indemniteRupture", "Indemnité de rupture négociée", "number", S.indemniteRupture,
      "0 tant qu'elle n'est pas négociée — le plancher légal est calculé plus bas", "0.01",
      "Montant total que vous toucherez à la rupture, plancher légal compris. Tout ce qui dépasse ce plancher retarde le premier versement de l'ARE d'un jour par tranche de 95,80 €, dans la limite de 150 jours.")
    + field("indemniteCongesPayes", "Indemnité compensatrice de congés payés", "number", S.indemniteCongesPayes, "",
      "0.01",
      "Ce que l'employeur vous paie pour les congés acquis et non pris. Attention : cette somme crée elle aussi un différé avant l'ARE. Prendre les congés avant la fin du contrat plutôt que se les faire payer supprime ce différé.")
    + "</div></div>";

  if (!pret) {
    return '<div class="panel"><div class="panel-h"><h2>Simulateur ARE</h2>'
      + '<span class="pill warn">données incomplètes</span></div>' + entrees
      + '<div class="panel-b"><p class="note warn">Il manque votre <b>date d\'entrée dans l\'entreprise</b> ou votre <b>salaire brut</b>. '
      + (Store.all("payslips").length
        ? "Vos fiches de paie sont pourtant enregistrées : vérifiez que la date d'entrée est bien renseignée ci-dessus."
        : "Enregistrez vos fiches de paie dans « Mon historique de paie » et les deux se rempliront d'eux-mêmes.")
      + " Ce simulateur reproduit la mécanique de France Travail sans la remplacer : seule la simulation officielle vous engage.</p></div></div>";
  }

  const cascade = [
    { l: "Fin du contrat", v: fmtDateLong(r.fin) || "date non renseignée", j: null, c: "" },
    { l: "Différé congés payés", v: r.differeCP + " jours", j: r.differeCP, c: r.differeCP ? "warn" : "" },
    { l: "Différé spécifique (indemnité supra-légale)", v: r.differeSpecifique + " jours", j: r.differeSpecifique, c: r.differeSpecifique ? "bad" : "" },
    { l: "Délai d'attente", v: r.attente + " jours", j: r.attente, c: "" },
    { l: "Premier paiement", v: r.debut ? fmtDateLong(r.debut) : "—", j: null, c: "ok" }
  ];

  return '<div class="panel"><div class="panel-h"><h2>Simulateur ARE</h2>'
    + '<span class="xs dim" style="flex:1">ancienneté ' + nNUM.format(r.anciennete) + " ans au terme du contrat</span>"
    + '<button class="btn sm primary" data-act="are-report">Reporter dans mes droits</button></div>'
    + entrees
    + '<div class="kpis" style="border:0;border-bottom:2px solid var(--line);border-radius:0">'
    + kpi(eur2(r.netJour), "ARE nette / jour", eur2(r.brutJour) + " brut")
    + kpi(eur(r.netJour * 30), "≈ par mois", "sur 30 jours")
    + kpi(num(r.duree) + " j", "Durée d'indemnisation", "soit " + nNUM.format(r.duree / 30.4) + " mois")
    + kpi(eur(r.totalNet), "Total net des droits", "avant reprise d'activité")
    + "</div>"
    + '<div class="panel-b" style="display:flex;flex-direction:column;gap:12px">'
    + '<div><div class="eyebrow" style="margin-bottom:7px">Quand tombe le premier paiement</div>'
    + '<div class="tasks" style="border:2px solid var(--line);border-radius:12px;overflow:hidden">'
    + cascade.map((c) => '<div class="task" style="cursor:default">'
      + '<span class="task-ico ' + c.c + '">' + (c.c === "ok" ? "💶" : c.j === null ? "📄" : c.j > 0 ? "⏳" : "✓") + "</span>"
      + '<span class="task-b"><span class="task-t">' + esc(c.l) + '</span></span>'
      + '<b class="num small">' + esc(c.v) + "</b></div>").join("")
    + "</div>"
    + '<div class="xs dim" style="margin-top:6px">Total des différés : ' + r.totalDiffere + " jours, soit " + nNUM.format(r.totalDiffere / 30.4) + " mois sans allocation ni salaire.</div></div>"
    + '<div class="grid-2" style="gap:12px">'
    + '<div><div class="eyebrow" style="margin-bottom:5px">Indemnité de rupture</div>'
    + '<table><tbody>'
    + '<tr><td class="lab small">Plancher légal</td><td class="tnum">' + eur(r.legale) + "</td></tr>"
    + '<tr><td class="lab small">Négociée</td><td class="tnum">' + eur(nz(S.indemniteRupture)) + "</td></tr>"
    + '<tr><td class="lab small">Part supra-légale</td><td class="tnum"><b>' + eur(r.supra) + "</b></td></tr>"
    + "</tbody></table></div>"
    + '<div><div class="eyebrow" style="margin-bottom:5px">Si ARCE demandée</div>'
    + '<table><tbody>'
    + '<tr><td class="lab small">Capital versé</td><td class="tnum"><b>' + eur(r.arce) + "</b></td></tr>"
    + '<tr><td class="lab small">1er versement</td><td class="tnum">' + eur(r.arce / 2) + "</td></tr>"
    + '<tr><td class="lab small">2nd versement</td><td class="tnum">' + eur(r.arce / 2) + " (+" + S.params.aides.arce.moisSecondVersement + " mois)</td></tr>"
    + "</tbody></table></div></div>"
    + (r.supra > 0
      ? '<p class="note warn"><b>Le piège de la négociation.</b> Chaque euro d\'indemnité au-dessus du plancher légal repousse le début de votre ARE de 1 jour par tranche de '
        + nNUM.format(A.differeDiviseur) + " €. Votre part supra-légale de " + eur(r.supra) + " coûte <b>" + r.differeSpecifique
        + " jours de différé</b>, soit environ " + eur(r.differeSpecifique * r.netJour) + " d'allocations décalées"
        + (r.differeSpecifique >= A.differeSpecifiqueMax ? " — et vous êtes déjà au plafond de " + A.differeSpecifiqueMax + " jours." : ".")
        + " Négocier plus haut reste souvent gagnant, mais le gain net est inférieur au montant affiché.</p>"
      : '<p class="note">Aucune part supra-légale saisie : pas de différé spécifique. Si vous négociez au-dessus du plancher légal de '
        + eur(r.legale) + ", un différé apparaîtra ici.</p>")
    + '<p class="note warn"><b>Ordres de grandeur.</b> La partie fixe, le plancher, la durée maximale et le coefficient de minoration sont revalorisés chaque année et dépendent de la conjoncture ; '
    + "le diviseur du différé et le taux de prélèvement sur l'ARE sont les valeurs les moins sûres du fichier. Le salaire journalier de référence est ici approché par le brut ÷ 365, "
    + "alors que France Travail retient les jours effectivement travaillés. <b>Faites la simulation officielle sur francetravail.fr</b> et reportez le résultat dans les réglages.</p>"
    + "</div></div>";
}

/* --- projection pluriannuelle : que rapporte réellement l'année 1, puis les suivantes --- */
function blocProjection(S) {
  const statut = S.statut === "undecided" ? "micro" : S.statut;
  const are = droitsARE(S);
  const scenario = S.scenarioAide || "arce";
  const comp = comparerScenarios(S, statut);
  const proj = (comp.find((c) => c.id === scenario) || comp[0]).proj;
  const meilleur = comp.slice().sort((a, b) => b.total - a.total)[0];
  const maxNet = Math.max(1, ...proj.annees.map((a) => Math.max(0, a.net)));
  const N = proj.annees.length;

  if (are.journaliere <= 0) {
    return '<div class="panel"><div class="panel-h"><h2>Projection sur plusieurs années</h2></div>'
      + '<div class="panel-b"><p class="note warn">Pour projeter vos revenus avec les aides, renseignez votre <b>salaire brut annuel</b> '
      + "(estimation) ou, bien mieux, votre <b>ARE journalière</b> et vos <b>jours de droits</b> relevés sur France Travail. "
      + 'Les deux champs sont dans « Aides et projection pluriannuelle », à gauche.</p></div></div>';
  }

  const selecteur = SCENARIOS.map((sc) =>
    '<button class="btn sm' + (sc.id === scenario ? " primary" : "") + '" data-act="scenario" data-id="' + sc.id + '">' + esc(sc.court) + "</button>").join("");

  const lignes = proj.annees.map((a) => {
    const w = Math.round(Math.max(0, a.net) / maxNet * 100);
    return "<tr>"
      + '<td style="white-space:nowrap"><b>Année ' + a.annee + "</b>"
      + (a.acre ? ' <span class="pill ok">ACRE</span>' : "") + "</td>"
      + '<td class="tnum">' + num(a.jours) + " j</td>"
      + '<td class="tnum">' + eur(a.CA) + "</td>"
      + '<td class="tnum">− ' + eur(a.social + a.is) + "</td>"
      + '<td class="tnum">− ' + eur(a.ir) + "</td>"
      + '<td class="tnum">' + (a.aide > 0 ? '<span class="delta pos">+ ' + eur(a.aide) + "</span>" : "—") + "</td>"
      + '<td style="min-width:150px"><div class="row" style="gap:8px">'
      + '<div class="bar" style="flex:1"><i style="width:' + w + '%"></i></div>'
      + '<b class="num" style="min-width:74px;text-align:right">' + eur(a.net) + "</b></div></td>"
      + "</tr>";
  }).join("");

  const comparatif = '<div class="scroll-x"><table><thead><tr><th>Scénario sur ' + N + " ans</th>"
    + proj.annees.map((a) => '<th class="tnum">An ' + a.annee + "</th>").join("")
    + '<th class="tnum">Total net</th><th></th></tr></thead><tbody>'
    + comp.map((c) => "<tr" + (c.id === scenario ? ' class="hi"' : "") + ">"
      + "<td>" + esc(c.nom) + "</td>"
      + c.proj.annees.map((a) => '<td class="tnum">' + eur(a.net) + "</td>").join("")
      + '<td class="tnum"><b>' + eur(c.total) + "</b></td>"
      + '<td class="tnum">' + (c.id === meilleur.id ? '<span class="pill ok">le plus élevé</span>'
        : '<span class="xs dim num">− ' + eur(meilleur.total - c.total) + "</span>") + "</td></tr>").join("")
    + "</tbody></table></div>";

  return '<div class="panel"><div class="panel-h"><h2>Projection sur plusieurs années</h2>'
    + '<span class="xs dim" style="flex:1">statut retenu : ' + esc((STATUTS.find((x) => x.id === statut) || {}).nom || statut)
    + (S.statut === "undecided" ? " (par défaut, aucun statut n'est arrêté)" : "") + "</span>"
    + '<span class="row" style="gap:5px">' + selecteur + "</span></div>"
    + '<div class="kpis" style="border:0;border-bottom:2px solid var(--line);border-radius:0">'
    + kpi(eur(are.journaliere) + " / j", "ARE journalière", are.estime ? "estimée — à confirmer" : "relevé France Travail")
    + kpi(num(are.jours) + " j", "Droits restants", "soit " + eur(are.jours * are.journaliere) + " au total")
    + kpi(eur(proj.arceTotal), "ARCE si demandée", pct(S.params.aides.arce.part, 0) + " du reliquat, en 2 versements")
    + kpi(eur(proj.total), "Net cumulé sur " + N + " ans", esc((SCENARIOS.find((x) => x.id === scenario) || {}).court))
    + "</div>"
    + '<div class="scroll-x"><table><thead><tr><th>Période</th><th class="tnum">Jours</th><th class="tnum">CA HT</th>'
    + '<th class="tnum">Cotisations + IS</th><th class="tnum">Impôt</th><th class="tnum">Aide perçue</th><th>Net disponible</th></tr></thead><tbody>'
    + lignes + "</tbody></table></div>"
    + '<div class="panel-b" style="border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px">'
    + '<div class="eyebrow">Comparaison des trois scénarios</div>' + comparatif
    + '<p class="note warn"><b>Le choix entre ARCE et maintien de l\'ARE est définitif.</b> L\'ARCE verse '
    + pct(S.params.aides.arce.part, 0) + " du reliquat de vos droits en capital (2 versements, le second "
    + S.params.aides.arce.moisSecondVersement + " mois après le premier) et solde vos droits ; le maintien verse une allocation mensuelle "
    + "réduite de " + pct(S.params.aides.maintienARE.tauxDeduction, 0) + " de vos revenus d'activité, mais conserve vos droits plus longtemps. "
    + "L'ARCE est la plus intéressante quand l'activité démarre vite, le maintien quand elle démarre lentement.</p>"
    + '<p class="note">Hypothèses : année 1 à ' + num(nz(S.joursAnnee1)) + " jours facturés puis " + num(nz(S.joursFactures))
    + " jours par an ; ACRE appliquée la 1re année uniquement ; l'ARE est imposable, le traitement fiscal de l'ARCE "
    + (S.params.aides.arce.imposable ? "est traité comme imposable" : "est traité comme non imposable")
    + " — <b>ce point est à confirmer par un expert-comptable</b>. Le maintien déduit "
    + pct(S.params.aides.maintienARE.tauxDeduction, 0) + " du revenu d'activité <i>déclaré</i> (en micro-entreprise, le CA après abattement), "
    + "sur une base annuelle alors que France Travail liquide mois par mois : sur une activité irrégulière, le résultat réel sera plus favorable que cette moyenne.</p>"
    + (are.estime ? '<p class="note bad" style="border-color:var(--red);background:var(--red-soft);color:var(--bad)">L\'ARE affichée est une <b>estimation</b> calculée à partir de votre salaire brut. '
      + "Le montant réel dépend de votre relevé de situation France Travail, du différé d'indemnisation lié à votre indemnité de rupture et du délai d'attente. "
      + "Faites la simulation officielle avant de vous appuyer sur ces chiffres.</p>" : "")
    + "</div></div>";
}

/** Liste déroulante maison. Un champ caché porte le `name` et la valeur, si bien
 *  que tout le code qui lisait un <select> continue de fonctionner à l'identique. */
function selectHTML(name, options, valeur) {
  const courant = options.find((o) => String(o.v) === String(valeur)) || options[0] || { v: "", l: "—" };
  return '<span class="sel">'
    + '<input type="hidden" name="' + esc(name) + '" value="' + esc(courant.v) + '">'
    + '<button type="button" class="sel-btn" data-act="sel-open" aria-haspopup="listbox" aria-expanded="false">'
    + '<span class="sel-val">' + esc(courant.l) + '</span><span class="sel-chev">&#9660;</span></button>'
    + '<span class="sel-list" role="listbox" hidden>'
    + options.map((o) => '<button type="button" class="sel-opt' + (String(o.v) === String(courant.v) ? " on" : "")
      + '" role="option" data-act="sel-opt" data-v="' + esc(o.v) + '">' + esc(o.l) + "</button>").join("")
    + "</span></span>";
}

/* Fabrique commune à tous les champs : étiquette, contrôle, aide, et le
   bouton « i » qui déplie une explication en clair. */
let infoSeq = 0;
function champ(label, ctrl, hint, info) {
  const id = info ? "inf" + (++infoSeq) : null;
  return '<label class="f">'
    + '<span class="f-lab">' + esc(label)
    + (id ? '<button type="button" class="info-btn" data-act="info" data-for="' + id
      + '" aria-expanded="false" aria-label="Explication : ' + esc(label) + '">i</button>' : "")
    + "</span>"
    + ctrl
    + (hint ? '<span class="hint">' + hint + "</span>" : "")
    + (id ? '<span class="info-txt" id="' + id + '">' + esc(info) + "</span>" : "")
    + "</label>";
}

function field(name, label, type, value, hint, step, info) {
  return champ(label,
    '<input type="' + type + '" data-sfield="' + name + '" value="' + esc(value) + '"'
    + (step ? ' step="' + step + '"' : "") + ">", hint, info);
}

/** Marche à suivre numérotée : « pas à pas » suppose des étapes ordonnées. */
function guideHTML(texte) {
  const lignes = String(texte || "").split("\n");
  const out = [];
  let liste = false;
  for (const l of lignes) {
    const m = l.match(/^\s*[-*•]\s+(.+)$/);
    if (m) {
      if (!liste) { out.push("<ol>"); liste = true; }
      out.push("<li>" + esc(m[1].trim()) + "</li>");
    } else {
      if (liste) { out.push("</ol>"); liste = false; }
      if (l.trim()) out.push("<p>" + esc(l.trim()) + "</p>");
    }
  }
  if (liste) out.push("</ol>");
  return out.join("");
}

        + '<span class="pt">' + esc(ph.titre) + "</span>"

        + (ph.note ? '<div style="padding:12px 15px;border-top:2px solid var(--line)"><p class="note warn">' + esc(ph.note) + "</p></div>" : "")
        + li.map((i) => {
          const e = etatCheck(i);
          const reste = i.attenduLe ? daysDiff(i.attenduLe, t) : null;
          const retard = e === "en_attente" && reste !== null && reste < 0;
          const cls = e === "fait" ? " fait" : e === "en_attente" ? " attente" : "";
          const guide = i.commentFaire || GUIDES[i.cle] || GUIDES[i.id] || "";
          const ong = i.onglet || GUIDE_ONGLET[i.cle] || GUIDE_ONGLET[i.id] || "";
          return '<div class="ck' + cls + '">'
            + '<button class="ck-check" data-act="check-toggle" data-id="' + i.id + '" aria-label="'
            + (e === "fait" ? "Rouvrir cette démarche" : "Marquer comme faite") + '">'
            + (e === "fait" ? "&#10003;" : e === "en_attente" ? "&#9203;" : "&nbsp;") + "</button>"
            + '<div class="b"><div class="t">' + esc(i.titre) + "</div>"
            + '<div class="meta">'
            + (e === "en_attente"
              ? '<span class="pill ' + (retard ? "bad" : "warn") + '">'
                + (reste === null ? "en attente" : retard ? "retour en retard de " + (-reste) + " j"
                  : reste === 0 ? "retour attendu aujourd&#39;hui" : "retour attendu J−" + reste) + "</span>"
              : "")
            + (ong ? '<button class="btn sm primary" data-act="go-tab" data-tab="' + esc(ong) + '">'
              + esc((TABS.find((t) => t.id === ong) || {}).nom || "Ouvrir") + "</button>" : "")
            + (i.lien ? '<a class="xs" href="' + esc(i.lien) + '" target="_blank" rel="noopener">' + esc(i.organisme || "Site officiel") + "</a>"
              : i.organisme ? '<span class="xs dim">' + esc(i.organisme) + "</span>" : "")
            + (i.echeance ? '<span class="pill num' + (daysDiff(t, i.echeance) > 0 && e !== "fait" ? " bad" : "") + '">échéance ' + fmtDate(i.echeance) + "</span>" : "")
            + (i.note ? '<span class="xs dim">' + esc(i.note) + "</span>" : "")
            + (e !== "fait"
              ? '<button class="btn sm ghost" data-act="check-attente" data-id="' + i.id + '" title="'
                + (nz(i.delaiAttente) > 0 ? "Délai habituel : " + nz(i.delaiAttente) + " jours" : "Lancer un compte à rebours") + '">'
                + (e === "en_attente" ? "Annuler l&#39;attente" : "&#9203; En attente") + "</button>"
              : "")
            + (i.resultat ? '<span class="pill ok" title="' + esc(String(i.resultat).slice(0, 160)) + '">&#10003; consigné</span>' : "")
            + '<button class="btn sm blue" data-act="check-prep" data-id="' + i.id + '">'
            + (i.resultat ? "Voir / compléter" : i.brouillon ? "&#9998; Mon brouillon" : "Préparer avec Claude") + "</button>"
            + '<button class="btn sm ghost" data-act="check-edit" data-id="' + i.id + '">Modifier</button>'
            + "</div>"
            + (guide ? '<details class="guide"><summary>&#9432; Comment faire</summary>'
              + '<div class="guide-b">' + guideHTML(guide) + "</div></details>" : "")
            + "</div></div>";
        }).join("")
        + (li.length ? "" : '<div class="empty">Aucune ligne dans cette phase.</div>')
        + "</details>";
    }).join("")
    + '<p class="note">Les liens pointent vers les sites officiels des organismes. Lorsqu\'aucun lien certain n\'existe pour une démarche précise, seul le nom de l\'organisme est indiqué.</p>'
    + "</div>";
};

/** Met en évidence les fragments listés dans `surligne`, sans jamais injecter de HTML. */
function surligner(texte, fragments) {
  const parts = String(fragments || "").split("|").map((f) => f.trim()).filter(Boolean);
  let out = esc(texte);
  for (const f of parts) {
    const cible = esc(f);
    const i = out.indexOf(cible);
    if (i >= 0) out = out.slice(0, i) + "<em>" + cible + "</em>" + out.slice(i + cible.length);
  }
  return out;
}

/* ---------------------------------------------------------------- 4. MISSIONS */
function joursConsommes(missionId) {
  return Store.all("workdays").filter((w) => w.missionId === missionId).reduce((a, w) => a + nz(w.jours), 0);
}
function caFacture(year) {
  return Store.all("invoices").filter((i) => (i.dateEmission || "").slice(0, 4) === String(year)).reduce((a, i) => a + nz(i.montantHT), 0);
}
function caEncaisse(year) {
  return Store.all("invoices").filter((i) => i.dateEncaissement && i.dateEncaissement.slice(0, 4) === String(year)).reduce((a, i) => a + nz(i.montantHT), 0);
}

VIEWS.missions = function (S) {
  const year = new Date().getFullYear();
  const missions = Store.all("missions");
  const invoices = Store.all("invoices").slice().sort((a, b) => (b.dateEmission || "").localeCompare(a.dateEmission || ""));
  const factured = caFacture(year), encaisse = caEncaisse(year);
  const attente = invoices.filter((i) => !i.dateEncaissement).reduce((a, i) => a + nz(i.montantHT), 0);
  const echues = invoices.filter((i) => !i.dateEncaissement && i.dateEcheance && daysDiff(todayISO(), i.dateEcheance) > 0);
  const P = S.params;

  const alerte = echues.length
    ? '<div class="panel" style="border-color:var(--bad)"><div class="panel-h" style="background:var(--bad-soft)">'
      + '<h2 style="color:var(--bad)">Factures échues non payées</h2><span class="pill bad">' + echues.length + "</span>"
      + '<span class="num small" style="margin-left:auto;color:var(--bad)">' + eur(echues.reduce((a, i) => a + nz(i.montantHT), 0)) + "</span></div>"
      + '<div class="scroll-x"><table><tbody>'
      + echues.map((i) => "<tr><td>" + esc(i.numero || "—") + '</td><td class="xs dim">' + esc(clientOf(i)) + "</td>"
        + '<td class="tnum">' + eur(nz(i.montantHT)) + '</td><td class="tnum"><span class="pill bad">+' + daysDiff(todayISO(), i.dateEcheance) + " j</span></td>"
        + '<td class="tnum"><button class="btn sm" data-act="inv-paid" data-id="' + i.id + '">Encaissée</button></td></tr>').join("")
      + "</tbody></table></div></div>"
    : "";

  const kpis = '<div class="kpis">'
    + kpi(eur(factured), "CA facturé " + year, "")
    + kpi(eur(encaisse), "CA encaissé " + year, "")
    + kpi(eur(attente), "En attente d'encaissement", echues.length ? echues.length + " facture(s) échue(s)" : "")
    + "</div>";

  let jauges = "";
  if (S.statut === "micro") {
    const moisEcoules = new Date().getMonth() + 1;
    const rythme = moisEcoules > 0 ? factured / moisEcoules : 0;
    const proj = (seuil) => {
      if (rythme <= 0) return "—";
      if (factured >= seuil) return "seuil déjà dépassé";
      const moisNeeded = seuil / rythme;
      if (moisNeeded > 12) return "non atteint au rythme actuel";
      const d = new Date(year, Math.ceil(moisNeeded) - 1, 1);
      return "vers " + d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    };
    const g = (label, seuil, desc) => {
      const p = seuil > 0 ? clamp(factured / seuil, 0, 1) : 0;
      const cls = p >= 1 ? "bad" : p >= 0.8 ? "warn" : "ok";
      return '<div style="flex:1 1 260px;display:flex;flex-direction:column;gap:5px">'
        + '<div class="row"><span class="small" style="flex:1">' + esc(label) + '</span><span class="num small">' + eur(factured) + " / " + eur(seuil) + "</span></div>"
        + '<div class="bar"><i class="' + cls + '" style="width:' + Math.round(p * 100) + '%"></i></div>'
        + '<div class="xs dim">' + esc(desc) + " · " + proj(seuil) + "</div></div>";
    };
    jauges = '<div class="panel"><div class="panel-h"><h2>Plafonds micro-entreprise</h2>'
      + '<span class="xs dim">projection au rythme du CA facturé depuis janvier</span></div>'
      + '<div class="panel-b row wrap" style="gap:20px">'
      + g("Franchise en base de TVA", P.micro.tvaFranchiseBase, "seuil majoré " + eur(P.micro.tvaFranchiseMajore))
      + g("Plafond du régime micro", P.micro.plafondCA, "sortie du régime au-delà")
      + "</div></div>";
  }

  const tblMissions = '<div class="panel"><div class="panel-h"><h2>Missions</h2><div style="flex:1"></div>'
    + '<button class="btn sm" data-act="mission-new">+ Mission</button></div>'
    + (missions.length ? '<div class="scroll-x"><table><thead><tr><th>Client</th><th class="tnum">TJM</th><th>Période</th><th style="min-width:150px">Avancement</th><th>Statut</th><th></th></tr></thead><tbody>'
      + missions.map((m) => {
        const cons = joursConsommes(m.id), vend = nz(m.joursVendus);
        const p = vend > 0 ? clamp(cons / vend, 0, 1) : 0;
        return "<tr><td>" + esc(m.client) + '</td><td class="tnum">' + eur(nz(m.tjm)) + "</td>"
          + '<td class="xs dim num">' + fmtDate(m.dateDebut) + " → " + fmtDate(m.dateFinPrevue) + "</td>"
          + '<td><div class="bar"><i class="' + (p >= 1 ? "warn" : "") + '" style="width:' + Math.round(p * 100) + '%"></i></div>'
          + '<div class="xs dim num">' + num(cons) + " / " + num(vend) + " j</div></td>"
          + '<td><span class="pill' + (m.statut === "en_cours" ? " ok" : "") + '">' + esc(labelStatutMission(m.statut)) + "</span></td>"
          + '<td class="tnum"><button class="btn sm ghost" data-act="mission-edit" data-id="' + m.id + '">Modifier</button></td></tr>';
      }).join("") + "</tbody></table></div>"
      : '<div class="empty">Aucune mission. Ajoutez-en une quand une piste passe en « Gagné ».</div>')
    + "</div>";

  const moisList = derniersMois(6);
  const grille = missions.length ? '<details class="panel"' + (localStorage_get("grilleOpen") === "1" ? " open" : "") + ' id="grilleJours">'
    + '<summary class="panel-h"><span class="chev">&#9656;</span><h2>Jours travaillés par mois</h2><span class="xs dim">saisie mensuelle, pas de timesheet</span></summary>'
    + '<div class="scroll-x"><table><thead><tr><th>Mission</th>' + moisList.map((m) => '<th class="tnum">' + fmtMonth(m) + "</th>").join("") + '<th class="tnum">Total</th></tr></thead><tbody>'
    + missions.map((m) => "<tr><td>" + esc(m.client) + "</td>"
      + moisList.map((mo) => {
        const w = Store.all("workdays").find((x) => x.missionId === m.id && x.mois === mo);
        return '<td class="tnum"><input type="number" min="0" max="31" step="0.5" style="width:62px;text-align:right" data-act="wd" data-mission="' + m.id + '" data-mois="' + mo + '" value="' + (w ? esc(w.jours) : "") + '"></td>';
      }).join("")
      + '<td class="tnum num">' + num(joursConsommes(m.id)) + "</td></tr>").join("")
    + "</tbody></table></div></details>" : "";

  const tblFactures = '<div class="panel"><div class="panel-h"><h2>Factures</h2><div style="flex:1"></div>'
    + '<button class="btn sm" data-act="inv-new">+ Facture</button></div>'
    + (invoices.length ? '<div class="scroll-x"><table><thead><tr><th>N°</th><th>Mission</th><th class="tnum">HT</th><th class="tnum">TVA</th><th class="tnum">TTC</th><th>Émission</th><th>Échéance</th><th>Encaissement</th><th></th></tr></thead><tbody>'
      + invoices.map((i) => {
        const ht = nz(i.montantHT), tva = ht * nz(i.tauxTVA) / 100;
        const late = !i.dateEncaissement && i.dateEcheance && daysDiff(todayISO(), i.dateEcheance) > 0;
        return "<tr><td>" + esc(i.numero || "—") + '</td><td class="xs dim">' + esc(clientOf(i)) + "</td>"
          + '<td class="tnum">' + eur(ht) + '</td><td class="tnum">' + (tva ? eur(tva) : "—") + '</td><td class="tnum">' + eur(ht + tva) + "</td>"
          + '<td class="xs num dim">' + fmtDate(i.dateEmission) + '</td><td class="xs num' + (late ? "" : " dim") + '">' + (late ? '<span class="pill bad">' + fmtDate(i.dateEcheance) + "</span>" : fmtDate(i.dateEcheance)) + "</td>"
          + '<td class="xs num">' + (i.dateEncaissement ? '<span class="pill ok">' + fmtDate(i.dateEncaissement) + "</span>" : '<button class="btn sm" data-act="inv-paid" data-id="' + i.id + '">Marquer</button>') + "</td>"
          + '<td class="tnum"><button class="btn sm ghost" data-act="inv-edit" data-id="' + i.id + '">Modifier</button></td></tr>';
      }).join("") + "</tbody></table></div>"
      : '<div class="empty">Aucune facture enregistrée.</div>')
    + "</div>";

  return '<div class="stack">' + alerte + kpis + jauges + tblMissions + grille + tblFactures + "</div>";
};

function labelStatutMission(s) {
  return ({ prevue: "Prévue", en_cours: "En cours", terminee: "Terminée" })[s] || "En cours";
}
function clientOf(inv) {
  const m = Store.get("missions", inv.missionId);
  return m ? m.client : (inv.client || "—");
}
function derniersMois(n) {
  const out = [], d = new Date();
  d.setDate(1); d.setMonth(d.getMonth() - (n - 2));
  for (let i = 0; i < n; i++) { out.push(monthISO(d)); d.setMonth(d.getMonth() + 1); }
  return out;
}
function prochainsMois(n) {
  const out = [], d = new Date(); d.setDate(1);
  for (let i = 0; i < n; i++) { out.push(monthISO(d)); d.setMonth(d.getMonth() + 1); }
  return out;
}

/* ---------------------------------------------------------------- 5. ÉCHÉANCES */
VIEWS.echeances = function (S) {
  const taux = tauxProvision(S);
  const gen = genEcheances(S);
  const custom = Store.all("deadlines");
  const marks = {};
  custom.forEach((d) => { if (d.key) marks[d.key] = d; });
  const liste = gen.map((g) => ({ ...g, fait: !!(marks[g.key] && marks[g.key].fait), montant: marks[g.key] ? nz(marks[g.key].montant) : 0, docId: marks[g.key] ? marks[g.key].id : null }))
    .concat(custom.filter((d) => !d.key).map((d) => ({ key: null, date: d.date, libelle: d.libelle, cat: d.cat || "Perso", fait: !!d.fait, montant: nz(d.montant), docId: d.id, genere: false })))
    .sort((a, b) => (a.date || "").localeCompare(b.date || ""));

  const encaissements = Store.all("invoices").filter((i) => i.dateEncaissement);
  const encaisseAnnee = encaissements.filter((i) => i.dateEncaissement.slice(0, 4) === String(new Date().getFullYear()))
    .reduce((a, i) => a + nz(i.montantHT), 0);
  const provision = taux === null ? null : encaisseAnnee * taux;

  const blocProvision = '<div class="panel"><div class="panel-h"><h2>Provision automatique</h2>'
    + (taux === null ? '<span class="pill">statut non arrêté</span>' : '<span class="pill acc">' + pct(taux, 1) + " du CA encaissé</span>") + "</div>"
    + '<div class="panel-b">'
    + (taux === null
      ? '<p class="note warn">Choisissez un statut dans les réglages pour calculer ce que vous devez mettre de côté à chaque encaissement. C\'est le point qui fait échouer la plupart des débuts en freelance.</p>'
      : '<div class="kpis" style="border:0">'
        + kpi(eur(encaisseAnnee), "Encaissé cette année", "")
        + kpi(eur(provision), "À mettre de côté", "cotisations + impôt estimés")
        + kpi(eur(encaisseAnnee - provision), "Réellement disponible", "")
        + "</div>"
        + '<p class="note" style="margin-top:10px">Taux dérivé du simulateur pour le statut actif : (prélèvements sociaux + IS + impôt) ÷ CA HT. C\'est une estimation, pas un montant dû : les appels de cotisations et l\'impôt réel peuvent différer.</p>'
        + '<div class="row wrap" style="margin-top:9px;gap:8px">'
        + '<span class="xs dim">Sur un encaissement de</span>'
        + '<input type="number" id="provTest" value="10000" style="width:110px">'
        + '<span class="xs dim">je mets de côté</span><b class="num" id="provOut">' + eur(10000 * taux) + "</b></div>")
    + "</div></div>";

  const tblEch = '<div class="panel"><div class="panel-h"><h2>Échéances — 12 mois glissants</h2>'
    + '<span class="xs dim" style="flex:1">' + (S.statut === "undecided" ? "générées après le choix du statut" : "selon le statut actif") + "</span>"
    + '<button class="btn sm" data-act="ech-new">+ Échéance</button></div>'
    + (liste.length ? '<div class="scroll-x"><table><thead><tr><th></th><th>Date</th><th>Échéance</th><th>Type</th><th class="tnum">Montant</th><th></th></tr></thead><tbody>'
      + liste.map((e) => {
        const late = !e.fait && e.date && daysDiff(todayISO(), e.date) > 0;
        const soon = !e.fait && e.date && daysDiff(todayISO(), e.date) >= -14 && daysDiff(todayISO(), e.date) <= 0;
        return "<tr>"
          + '<td><input type="checkbox" data-act="ech-toggle" data-key="' + esc(e.key || "") + '" data-doc="' + esc(e.docId || "") + '"' + (e.fait ? " checked" : "") + ' aria-label="Fait"></td>'
          + '<td class="xs num' + (late ? "" : " dim") + '">' + (late ? '<span class="pill bad">' + fmtDate(e.date) + "</span>" : soon ? '<span class="pill warn">' + fmtDate(e.date) + "</span>" : fmtDate(e.date)) + "</td>"
          + '<td class="small"' + (e.fait ? ' style="color:var(--ink-3);text-decoration:line-through"' : "") + ">" + esc(e.libelle) + "</td>"
          + '<td><span class="pill">' + esc(e.cat) + "</span></td>"
          + '<td class="tnum">' + (e.montant ? eur(e.montant) : "—") + "</td>"
          + '<td class="tnum">' + (e.genere ? "" : '<button class="btn sm ghost" data-act="ech-del" data-doc="' + esc(e.docId) + '">Supprimer</button>') + "</td></tr>";
      }).join("") + "</tbody></table></div>"
      : '<div class="empty">Aucune échéance générée — choisissez un statut, ou ajoutez vos propres échéances.</div>')
    + '<div class="panel-b" style="border-top:1px solid var(--line)"><p class="note">Dates indicatives. Les dates exactes qui vous engagent figurent sur votre espace URSSAF et sur impots.gouv.fr.</p></div>'
    + "</div>";

  // Trésorerie 6 mois
  const mois = prochainsMois(6);
  const fixes = Store.all("fixedCosts").reduce((a, c) => a + nz(c.montantMensuel), 0);
  const rows = mois.map((mo) => {
    const inFactures = Store.all("invoices")
      .filter((i) => !i.dateEncaissement && (i.dateEcheance || "").slice(0, 7) === mo)
      .reduce((a, i) => a + nz(i.montantHT), 0);
    const inMissions = Store.all("missions").filter((m) => m.statut !== "terminee").reduce((a, m) => {
      const reste = Math.max(0, nz(m.joursVendus) - joursConsommes(m.id));
      if (reste <= 0 || !m.dateFinPrevue) return a;
      const finM = m.dateFinPrevue.slice(0, 7);
      const restants = mois.filter((x) => x >= monthISO(new Date()) && x <= finM);
      if (!restants.length || !restants.includes(mo)) return a;
      return a + (reste * nz(m.tjm)) / restants.length;
    }, 0);
    const out = liste.filter((e) => !e.fait && (e.date || "").slice(0, 7) === mo).reduce((a, e) => a + nz(e.montant), 0);
    return { mo, in: inFactures + inMissions, out: out + fixes, net: inFactures + inMissions - out - fixes };
  });
  let cumul = 0;
  const tresorerie = '<div class="panel"><div class="panel-h"><h2>Trésorerie — 6 mois</h2>'
    + '<span class="xs dim" style="flex:1">encaissements prévus − échéances connues − charges fixes</span>'
    + '<button class="btn sm" data-act="fc-new">+ Charge fixe</button></div>'
    + '<div class="scroll-x"><table><thead><tr><th>Mois</th><th class="tnum">Entrées prévues</th><th class="tnum">Sorties connues</th><th class="tnum">Solde du mois</th><th class="tnum">Cumul</th></tr></thead><tbody>'
    + rows.map((r) => {
      cumul += r.net;
      return "<tr><td>" + esc(fmtMonth(r.mo)) + '</td><td class="tnum">' + eur(r.in) + '</td><td class="tnum">− ' + eur(r.out) + "</td>"
        + '<td class="tnum"><span class="delta ' + (r.net >= 0 ? "pos" : "neg") + '">' + eur(r.net) + '</span></td>'
        + '<td class="tnum"><span class="delta ' + (cumul >= 0 ? "pos" : "neg") + '">' + eur(cumul) + "</span></td></tr>";
    }).join("")
    + "</tbody></table></div>"
    + (Store.all("fixedCosts").length
      ? '<div class="panel-b" style="border-top:1px solid var(--line)"><div class="eyebrow" style="margin-bottom:6px">Charges fixes mensuelles — ' + eur(fixes) + "</div>"
        + '<div class="row wrap">' + Store.all("fixedCosts").map((c) =>
          '<span class="pill" style="padding:3px 9px">' + esc(c.libelle) + " · " + eur(nz(c.montantMensuel))
          + ' <button class="btn sm ghost" style="padding:0 3px" data-act="fc-del" data-id="' + c.id + '" aria-label="Supprimer">&#10005;</button></span>').join("")
        + "</div></div>"
      : '<div class="panel-b" style="border-top:1px solid var(--line)"><p class="note">Aucune charge fixe saisie — le solde ne tient donc pas compte de votre loyer professionnel, de vos abonnements ou de vos assurances.</p></div>')
    + "</div>";

  return '<div class="stack">' + blocProvision + tblEch + tresorerie + "</div>";
};

const moisLong = (m) => {
  const d = new Date(String(m) + "-01T00:00:00");
  if (isNaN(d)) return String(m || "");
  const s = d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
};

/** « Mai 2024 – Aujourd'hui » : une fin vide signifie que le poste est en cours. */
function periodeCV(b) {
  if (b.debut || b.fin) {
    const d = b.debut ? moisLong(b.debut) : "";
    const f = b.fin ? moisLong(b.fin) : "Aujourd'hui";
    return d ? d + " – " + f : f;
  }
  return b.periode || "";
}

/** Transforme un texte libre en puces : une ligne commençant par « - » devient
 *  une puce, deux espaces avant le tiret la transforment en sous-puce. */
function descHTML(texte) {
  const lignes = String(texte || "").split("\n");
  const html = [];
  let niveau = 0;
  const fermer = (jusqua) => { while (niveau > jusqua) { html.push("</ul>"); niveau--; } };
  for (const brute of lignes) {
    const m = brute.match(/^([ \t]*)[-*•–]\s+(.+)$/);
    if (!m) {
      fermer(0);
      if (brute.trim()) html.push("<p>" + esc(brute.trim()) + "</p>");
      continue;
    }
    const indent = m[1].replace(/\t/g, "  ").length;
    const vise = Math.min(3, Math.floor(indent / 2) + 1);
    fermer(vise);
    while (niveau < vise) { html.push("<ul>"); niveau++; }
    html.push("<li>" + esc(m[2].trim()) + "</li>");
  }
  fermer(0);
  return html.join("");
}

function rendreCV(S, blocs) {
  const e = S.cvEntete || {};
  const contact = [e.email, e.tel, e.ville, e.liens].filter(Boolean).join("  ·  ");

    return '<p style="color:#7A8794;font-size:13px">Renseignez l\'en-tête et ajoutez des blocs : l\'aperçu se construit ici.</p>';
  }
  let html = '<div class="ap-head"><div class="ap-head-t">'
    + "<h1>" + esc(e.nom || "Votre nom") + "</h1>"
    + '<div class="ap-sub">' + esc(e.titre || "Développeur full-stack freelance") + "</div>"
    + (contact ? '<div class="ap-meta">' + esc(contact) + "</div>" : "")
    + "</div>"
    + (e.photo ? '<img class="ap-photo" src="' + esc(e.photo) + '" alt="">' : "")
    + "</div>";
  const groupes = [];
  blocs.forEach((b) => {
    const dernier = groupes[groupes.length - 1];
    if (dernier && dernier.type === b.type) dernier.items.push(b);
    else groupes.push({ type: b.type, items: [b] });
  });
  groupes.forEach((g) => {
    html += "<h2>" + esc(libelleType(TYPES_CV, g.type)) + "</h2>";
    if (g.type === "competence") {
      const tous = g.items.flatMap((b) => String(b.description || b.titre || "").split(/[,;\n]/));
      html += '<div class="ap-tags">' + tous.map((t) => t.trim()).filter(Boolean)
        .map((t) => '<span class="ap-tag">' + esc(t) + "</span>").join("") + "</div>";
    } else {
      g.items.forEach((b) => {
        const per = periodeCV(b);
        html += '<div class="ap-item"><h3>' + esc(b.titre) + "</h3>"
          + (b.sousTitre || per ? '<div class="ap-meta">' + esc([b.sousTitre, per].filter(Boolean).join(" · ")) + "</div>" : "")
          + (b.description ? descHTML(b.description) : "")
          + "</div>";
      });
    }
  });
  return html;
}

async function telecharger(nomFichier, contenu) {
  let ok = false;
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: nomFichier, data: contenu }); ok = true; }
  } catch (err) { ok = false; }
  if (!ok) {
    try { await navigator.clipboard.writeText(contenu); toast("Téléchargement indisponible — HTML copié dans le presse-papiers"); return false; }
    catch (_) { toast("Export impossible depuis cette page"); return false; }
  }
  return true;
}

const CHAPITRES = [

/* Un jalon est relié au reste de l'application de trois façons possibles :
   - `cle`  : une ligne de la checklist, désignée par sa CLÉ STABLE. C'est elle qui
              fait foi — cocher le jalon coche la ligne, et inversement. Renommer la
              ligne ne casse rien. `fb` sert de repli pour les bases créées avant les clés.
   - `test` : une vérité déduite des données (ARE renseignée, mission créée…).

const DX_CHEMIN = [0, 46, 66, 46, 0, -46, -66, -46];

/** La ligne de checklist adossée à un jalon, par clé stable puis par repli de titre. */
function tacheDuNoeud(n) {
  if (!n.cle) return null;
  const parCle = Store.all("checklist").find((c) => c.cle === n.cle);
  if (parCle) return parCle;
  if (!n.fb) return null;
  const f = n.fb.toLowerCase();
  return Store.all("checklist").find((c) => (c.titre || "").toLowerCase().includes(f)) || null;
}

const critereOk = (c, S) => { try { return !!c.ok(S); } catch (_) { return false; } };
const critereVal = (c, S) => { try { return c.val ? String(c.val(S)) : ""; } catch (_) { return ""; } };

function noeudFait(n, S) {
  // Un jalon adossé à une tâche n'a pas d'état propre : la checklist fait foi.
  const tache = tacheDuNoeud(n);
  if (tache) return etatCheck(tache) === "fait";
  // Un jalon à critères est franchi quand tous ses critères le sont, et pas autrement :
  // il ne peut pas être validé à la main, sinon l'affichage mentirait sur les données.
  if (n.criteres) return n.criteres.every((c) => critereOk(c, S));
  if (n.test) { try { if (n.test(S)) return true; } catch (_) { } }
  return ((jeu().noeuds) || []).includes(n.id);
}

function noeudsVisibles(S) {
  return AVENTURE.filter((n) => { try { return n.si ? !!n.si(S) : true; } catch (_) { return true; } });
}

function etatAventure(S) {
  const noeuds = noeudsVisibles(S);
  const faits = noeuds.map((n) => noeudFait(n, S));
  let courant = -1;
  const dispo = noeuds.map((n, i) => {
    const d = i === 0 || faits[i - 1];
    if (courant < 0 && d && !faits[i]) courant = i;
    return d;
  });
  return { noeuds, faits, dispo, courant, total: noeuds.length, nbFaits: faits.filter(Boolean).length };
}

VIEWS.aventure = function (S) {
  const e = etatAventure(S);
  const p = progressionNiveau(jeu().xp);
  const suivant = e.courant >= 0 ? e.noeuds[e.courant] : null;
  const xpRestant = e.noeuds.filter((n, i) => !e.faits[i]).reduce((a, n) => a + n.xp, 0);
  const branche = S.statut === "undecided" ? "chemin commun"
    : estPortage(S) ? "voie portage salarial"
      : estSociete(S) ? "voie société" : "voie micro-entreprise";

  const tete = '<div class="hero" style="max-width:540px;width:100%">'
    + anneauNiveau(p.pct, p.niveau)
    + '<div class="hero-main">'
    + "<h1>" + e.nbFaits + " / " + e.total + " jalons</h1>"
    + '<div class="bar" style="margin:2px 0 4px"><i style="width:' + Math.round(e.nbFaits / Math.max(1, e.total) * 100) + '%"></i></div>'
    + '<div class="hero-stats">'
    + '<span class="pill acc">' + num(nz(jeu().xp)) + " XP</span>"
    + '<span class="pill warn">🔥 ' + nz(jeu().serie) + " j</span>"
    + '<span class="pill' + (S.statut === "undecided" ? "" : " ok") + '">' + esc(branche) + "</span>"
    + '<span class="pill">' + num(xpRestant) + " XP à gagner</span>"
    + "</div></div>"
    + (suivant ? '<div style="flex:1 1 190px;display:flex;flex-direction:column;gap:7px;align-items:flex-start">'
      + '<div class="eyebrow">Prochain jalon</div>'
      + '<div class="row" style="gap:8px"><span style="font-size:22px">' + suivant.ico + "</span>"
      + '<b style="font-family:var(--display);font-size:15px">' + esc(suivant.t) + "</b></div>"
      + '<button class="btn primary" data-act="noeud" data-id="' + suivant.id + '">Commencer</button></div>'
      : '<div style="flex:1 1 190px"><div class="eyebrow">Terminé</div><p class="small muted">Tous les jalons de votre voie sont franchis.</p></div>')
    + "</div>";

  const chapitres = CHAPITRES.map((ch) => {
    const idx = e.noeuds.map((n, i) => (n.ch === ch.n ? i : -1)).filter((i) => i >= 0);
    if (!idx.length) return "";
    const f = idx.filter((i) => e.faits[i]).length;
    const complet = f === idx.length;
    return '<section class="chapitre">'
      + '<div class="chap-h"><span class="chap-n' + (complet ? " on" : "") + '">' + (complet ? "★" : ch.n) + "</span>"
      + '<span class="chap-t">' + esc(ch.t) + "</span>"
      + '<span class="chap-bar"><i style="width:' + Math.round(f / idx.length * 100) + '%"></i></span>'
      + '<span class="xs dim num">' + f + "/" + idx.length + "</span></div>"
      + '<div class="chemin">'
      + idx.map((i, k) => {
        const n = e.noeuds[i];
        const fait = e.faits[i], disponible = e.dispo[i];
        const cls = fait ? "fait" : disponible ? "dispo" : "verrou";
        const lien = k > 0 ? '<span class="lien' + (e.faits[idx[k - 1]] ? " on" : "") + '"></span>' : "";
        return lien
          + '<div class="nw" style="--dx:' + DX_CHEMIN[i % DX_CHEMIN.length] + 'px">'
          + '<button class="noeud ' + cls + (n.type === "carrefour" ? " carrefour" : "")
          + '" data-act="noeud" data-id="' + n.id + '" aria-label="' + esc(n.t) + '">'
          + (fait ? "✓" : n.ico)
          + (fait ? "" : '<span class="nxp">' + n.xp + "</span>")
          + (i === e.courant ? '<span class="bulle">COMMENCER</span>' : "")
          + "</button>"
          + '<span class="noeud-t' + (fait || disponible ? " on" : "") + '">' + esc(n.t) + "</span>"
          + "</div>";
      }).join("")
      + "</div></section>";
  }).join("");

  return '<div class="aventure">' + tete + chapitres + "</div>";
};

function noeudModal(id) {
  const S = Store.settings;

  const n = e.noeuds[i];
  const fait = e.faits[i];

  if (!fait && !e.dispo[i]) { toast("Terminez d'abord « " + e.noeuds[i - 1].t + " »"); return; }

  const corps = '<div class="row" style="gap:12px;align-items:flex-start">'

    + '<div style="flex:1;min-width:0"><p class="small">' + esc(n.d) + "</p>"
    + '<div class="row wrap" style="gap:6px;margin-top:7px">'
    + '<span class="pill' + (fait ? " ok" : " warn") + '">' + (fait ? "Franchi" : "+" + n.xp + " XP") + "</span>"
    + (n.type === "carrefour" ? '<span class="pill acc">Carrefour</span>' : "")
    + (tache ? '<span class="pill">Tâche liée</span>' : "")

    + (tache ? '<p class="note" style="margin-top:9px">Adossé à la démarche : <b>' + esc(tache.titre) + "</b>. "
      + "Cocher ici coche la démarche, et inversement — les deux ne peuvent pas diverger.</p>"
      : n.criteres ? '<p class="note" style="margin-top:9px">Ce jalon se franchit tout seul dès que ces conditions sont remplies. '
        + "Elles portent sur vos données réelles : rien ne se coche à la main ici.</p>"
      : n.type === "carrefour" ? "" : '<p class="note" style="margin-top:9px">Ce jalon se franchit tout seul dès que la donnée existe dans l\'application.</p>')
    + "</div></div>"
    + (n.criteres ? '<div class="crit">' + n.criteres.map((c) => {
      const ok = critereOk(c, S), v = critereVal(c, S);
      return '<div class="crit-l' + (ok ? " on" : "") + '">'
        + '<span class="crit-p">' + (ok ? "&#10003;" : "&#9675;") + "</span>"
        + "<span>" + esc(c.l) + "</span>"
        + (v ? '<b class="num">' + esc(v) + "</b>" : "")
        + "</div>";
    }).join("") + "</div>" : "");

  const options = n.type === "carrefour"
    ? '<div class="choix" style="margin-top:4px">' + n.options.map((o) =>
      '<button data-act="noeud-choix" data-id="' + n.id + '" data-opt="' + esc(o.v) + '">'
      + '<span class="ci">' + o.ico + "</span>"
      + '<span class="cb"><span class="ct">' + esc(o.l) + '</span><span class="cd">' + esc(o.d) + "</span></span>"
      + "</button>").join("") + "</div>"
    : "";

  const html = '<div class="scrim"><div class="modal" role="dialog" aria-modal="true">'
    + '<div class="modal-h"><h2>' + esc(n.t) + '</h2><button class="icon-btn" data-close="1" aria-label="Fermer">&#10005;</button></div>'
    + '<div class="modal-b">' + corps + options + "</div>"
    + '<div class="modal-f">'
    + (n.go ? '<button class="btn" data-act="noeud-go" data-id="' + n.id + '">Ouvrir ' + esc((TABS.find((t) => t.id === n.go) || {}).nom || "") + "</button>" : "")
    + (n.type === "carrefour" || fait || n.criteres || (!tache && n.test) ? "" : '<button class="btn primary" data-act="noeud-ok" data-id="' + n.id + '">C\'est fait</button>')
    + "</div></div></div>";
  $("#modalRoot").innerHTML = html;
  const root = $("#modalRoot");
  root.querySelectorAll("button[data-close]").forEach((b) => b.addEventListener("click", closeModal));
  root.querySelector(".scrim").addEventListener("click", (ev) => { if (ev.target.classList.contains("scrim")) closeModal(); });
}

async function validerNoeud(id, patch) {
  const n = AVENTURE.find((x) => x.id === id);
  if (!n) return;
  const tache = tacheDuNoeud(n);
  if (tache) {
    // La checklist est l'unique source de vérité : on coche la ligne, pas le jalon.
    if (etatCheck(tache) !== "fait") await toggleCheck(tache.id);
    if (patch) await Store.saveSettings(patch);
    celebrer();
    return;
  }
  const j = { ...jeu() };
  const l = (j.noeuds || []).slice();
  if (!l.includes(id)) l.push(id);
  j.noeuds = l;
  await Store.saveSettings({ jeu: j, ...(patch || {}) });
  celebrer();
}

  const main = cfg.fields.filter((f) => !f.fold);
  const extra = cfg.fields.filter((f) => f.fold);
  const html = '<div class="scrim" data-close="1"><div class="modal' + (cfg.wide ? " wide" : "") + '" role="dialog" aria-modal="true">'
    + '<div class="modal-h"><h2>' + esc(cfg.title) + '</h2><button class="icon-btn" data-close="1" aria-label="Fermer">&#10005;</button></div>'
    + '<form class="modal-b" id="mform">'
    + main.map((f) => fieldHTML(f, vals[f.name])).join("")
    + (extra.length ? '<details class="fold"><summary>Champs optionnels</summary><div class="fold-b">'
      + extra.map((f) => fieldHTML(f, vals[f.name])).join("") + "</div></details>" : "")
    + (cfg.note ? '<p class="note">' + cfg.note + "</p>" : "")
    + "</form>"
    + '<div class="modal-f">'
    + (cfg.onDelete ? '<button class="btn danger" id="mdel">Supprimer</button><div style="flex:1"></div>' : "")
    + '<button class="btn" data-close="1">Annuler</button>'
    + '<button class="btn primary" id="msave">' + esc(cfg.submitLabel || "Enregistrer") + "</button>"
    + "</div></div></div>";
  $("#modalRoot").innerHTML = html;

  const root = $("#modalRoot");
  root.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]") && (e.target.dataset.close || e.target.closest("[data-close]") === e.target || e.target.classList.contains("scrim"))) {
      if (e.target.classList.contains("scrim") || e.target.closest("button[data-close]")) closeModal();
    }
  });
  $("#msave").addEventListener("click", () => {
    const out = {};
    for (const f of cfg.fields) {
      const el = $('[name="' + f.name + '"]', root);
      if (!el) continue;
      out[f.name] = f.type === "checkbox" ? el.checked : (f.type === "number" ? (el.value === "" ? 0 : Number(el.value)) : el.value);
    }
    if (cfg.required) {
      for (const r of cfg.required) {
        if (!String(out[r] ?? "").trim()) { toast("Champ obligatoire manquant"); return; }
      }
    }
    cfg.onSubmit(out);
    closeModal();
  });
  if (cfg.onDelete) {
    $("#mdel").addEventListener("click", () => { cfg.onDelete(); closeModal(); });
  }
  const first = $("#mform input, #mform select, #mform textarea", root);
  if (first) first.focus();
}

function fieldHTML(f, v) {
  const val = v === undefined || v === null ? (f.default ?? "") : v;
  let ctrl;
  if (f.type === "photo") {
    // Pas de <label> englobant : il déclencherait le sélecteur de fichier au moindre clic.
    return '<div class="f"><span class="f-lab">' + esc(f.label) + "</span>"
      + '<div class="photo-champ">'
      + '<input type="hidden" name="' + f.name + '" value="' + esc(val) + '">'
      + '<img class="photo-vue" alt="" src="' + esc(val) + '"' + (val ? "" : " hidden") + ">"
      + '<div class="row wrap" style="gap:7px">'
      + '<input type="file" accept="image/*" hidden data-role="photo-file">'
      + '<button type="button" class="btn sm" data-act="photo-pick">Choisir une photo</button>'
      + '<button type="button" class="btn sm ghost" data-act="photo-clear">Retirer</button>'
      + "</div></div>"
      + (f.hint ? '<span class="hint">' + f.hint + "</span>" : "")
      + "</div>";
  }
  if (f.type === "select") {
    ctrl = selectHTML(f.name, f.options, val);
  } else if (f.type === "textarea") {
    ctrl = '<textarea name="' + f.name + '">' + esc(val) + "</textarea>";
  } else if (f.type === "checkbox") {
    ctrl = '<label class="row small"><input type="checkbox" name="' + f.name + '"' + (val ? " checked" : "") + "> " + esc(f.checkLabel || "") + "</label>";
  } else {
    ctrl = '<input type="' + f.type + '" name="' + f.name + '" value="' + esc(val) + '"'
      + (f.step ? ' step="' + f.step + '"' : "") + (f.min !== undefined ? ' min="' + f.min + '"' : "") + ">";
  }
  return champ(f.label, ctrl, f.hint, f.info);
}

function moveLead(id, dir) {
  const l = Store.get("leads", id); if (!l) return;
  const i = clamp(STAGE_IDX[l.stage] + dir, 0, STAGES.length - 1);
  setLeadStage(l, STAGES[i].id);
}
function setLeadStage(l, stage) {
  if (l.stage === stage) return;
  const sd = { ...(l.stageDates || {}) };
  if (!sd[stage]) sd[stage] = todayISO();
  const S = Store.settings;
  const avant = STAGE_IDX[l.stage], apres = STAGE_IDX[stage];
  const rec = { ...l, stage, stageDates: sd, dernierContact: todayISO() };
  if (stage !== "gagne" && stage !== "perdu") rec.prochaineRelance = addDays(todayISO(), nz(S.delaiRelance, 7));
  delete rec.exemple;
  Store.put("leads", rec).then(() => {
    if (apres <= avant) return;
    const gain = stage === "envoyee" ? XP_GAIN.candidature
      : stage === "echange" ? XP_GAIN.echange
        : stage === "proposition" ? XP_GAIN.proposition
          : stage === "gagne" ? XP_GAIN.gagne : XP_GAIN.avance;
    gagnerXP(gain, stage === "gagne" ? "mission gagnée !" : "piste avancée");
    if (stage === "gagne") celebrer();
  });
}

/* --- démarches : à faire → en attente → fait --- */
async function toggleCheck(id) {
  const c = Store.get("checklist", id); if (!c) return;
  if (etatCheck(c) === "fait") {
    await Store.put("checklist", { ...c, etat: "a_faire", fait: false, faitLe: "" });
    return;
  }
  const avant = phaseStats(nz(c.phase, 1));
  await Store.put("checklist", { ...c, etat: "fait", fait: true, faitLe: todayISO(), attenduLe: "" });
  await gagnerXP(XP_GAIN.demarcheParPhase[nz(c.phase, 1)] || 20, "démarche accomplie");
  const apres = phaseStats(nz(c.phase, 1));
  if (apres.total > 0 && apres.faits === apres.total && avant.faits < avant.total) {
    celebrer();
    toastJeu("Phase " + nz(c.phase, 1) + " terminée !", "win");
  }
}
async function toggleAttente(id) {
  const c = Store.get("checklist", id); if (!c) return;
  if (etatCheck(c) === "en_attente") {
    await Store.put("checklist", { ...c, etat: "a_faire", attenduLe: "" });

  await Store.put("checklist", { ...c, etat: "en_attente", fait: false, attenduLe: addDays(todayISO(), delai) });

}

}

/** Atelier de préparation d'une démarche : on écrit son brouillon, Claude relit.
 *  Le brouillon reste la propriété de l'utilisateur — rien n'est remplacé sans son geste. */
function preparerModal(id) {
  const c = Store.get("checklist", id);
  if (!c) return;
  const dispo = !!state.sample;

  $("#modalRoot").innerHTML = '<div class="scrim"><div class="modal wide" role="dialog" aria-modal="true">'
    + '<div class="modal-h"><h2>Préparer : ' + esc(c.titre) + "</h2>"
    + '<button class="icon-btn" data-close="1" aria-label="Fermer">&#10005;</button></div>'
    + '<div class="modal-b">'
    + (c.note ? '<p class="note">' + esc(c.note) + "</p>" : "")
    + '<label class="f"><span class="f-lab">Mon brouillon</span>'
    + '<textarea id="prepTexte" style="min-height:180px" placeholder="Écrivez ici : votre argumentaire, votre message, vos notes…">'
    + esc(c.brouillon || "") + "</textarea>"
    + '<span class="hint">Ce texte vous appartient et reste enregistré avec la démarche. '
    + (dispo ? "Claude le relit, le corrige et signale ce qui manque — il ne le remplace que si vous le demandez."
      : "L'intégration Claude n'est pas disponible sur cette page ; le brouillon reste enregistré normalement.") + "</span></label>"
    + (dispo ? '<div class="row wrap" style="gap:9px">'
      + '<button class="btn blue" id="prepAsk">Demander à Claude de relire</button>'
      + '<span class="hint" id="prepEtat"></span></div>' : "")
    + '<div id="prepSortie"></div>'
    + '<label class="f" style="border-top:2px solid var(--line);padding-top:13px">'
    + '<span class="f-lab">Ce que j\'ai obtenu</span>'
    + '<textarea id="prepResultat" style="min-height:110px" placeholder="Numéro SIRET, référence de contrat, IBAN, nom du conseiller, date de réponse…">'
    + esc(c.resultat || "") + "</textarea>"
    + '<span class="hint">Consignez ici l\'information une fois obtenue. Tout ce que vous notez remonte dans le récapitulatif « Mes informations », en haut de cet onglet.</span></label>'
    + "</div>"
    + '<div class="modal-f"><button class="btn" data-close="1">Fermer</button>'
    + '<button class="btn primary" id="prepSave">Enregistrer</button></div>'
    + "</div></div>";

  const root = $("#modalRoot");
  root.querySelectorAll("button[data-close]").forEach((b) => b.addEventListener("click", closeModal));
  root.querySelector(".scrim").addEventListener("click", (ev) => { if (ev.target.classList.contains("scrim")) closeModal(); });
  $("#prepSave").addEventListener("click", () => {
    Store.put("checklist", { ...c, brouillon: $("#prepTexte").value, resultat: $("#prepResultat").value });
    closeModal();
    toast("Enregistré");
  });

  const ask = $("#prepAsk");
  if (!ask) return;
  ask.addEventListener("click", async () => {
    const s = state.sample;
    if (!s) return;
    const brouillon = $("#prepTexte").value.trim();
    const sortie = $("#prepSortie");
    ask.disabled = true;
    $("#prepEtat").textContent = "Claude réfléchit…";
    sortie.innerHTML = '<div class="msg ai" id="prepBulle">…</div>';
    const bulle = $("#prepBulle");
    const S = Store.settings;
    const prompt = "Tu aides un développeur français qui prépare son passage en freelance en Île-de-France.\n"
      + "Démarche en cours : " + c.titre + "\n"
      + (c.note ? "Ce que son cockpit en dit : " + c.note + "\n" : "")
      + "Statut envisagé : " + ((STATUTS.find((x) => x.id === S.statut) || {}).nom || "non arrêté")
      + " · TJM cible : " + nz(S.tjm) + " €\n\n"
      + (brouillon
        ? "Voici son brouillon :\n\"\"\"\n" + brouillon + "\n\"\"\"\n\n"
          + "Relis-le : corrige la langue, resserre ce qui traîne, signale ce qui manque ou ce qui le dessert. "
          + "Rends d'abord une version prête à l'emploi, puis trois remarques courtes au maximum."
        : "Il n'a encore rien écrit. Propose-lui un point de départ concret et bref pour cette démarche, "
          + "puis trois remarques courtes au maximum.")
      + "\n\nRéponds en français, sans flatterie ni préambule. N'invente aucun fait le concernant : "
      + "si une information te manque, laisse un espace à compléter entre crochets.";
    try {
      const res = await s(prompt, { onText: ({ text }) => { bulle.textContent = text; } });
      bulle.textContent = res.text + (res.truncated ? "\n\n(réponse tronquée)" : "");
      sortie.insertAdjacentHTML("beforeend",
        '<div class="row wrap" style="margin-top:9px;gap:9px">'
        + '<button class="btn sm primary" id="prepUse">Remplacer mon brouillon</button>'
        + '<span class="hint">Réponse générée : relisez-la avant d\'en faire quoi que ce soit.</span></div>');
      $("#prepUse").addEventListener("click", () => {
        $("#prepTexte").value = res.text;
        toast("Brouillon remplacé — pensez à enregistrer");
      });
    } catch (e) {
      const msg = erreurClaude(e && e.code);
      bulle.textContent = (e && e.text) ? e.text + "\n\n— " + msg : msg;
    } finally {
      ask.disabled = false;
      $("#prepEtat").textContent = "";
    }
  });
}

function contexteOnglet() {
  const S = Store.settings;
  const t = state.tab;
  const base = { onglet: (TABS.find((x) => x.id === t) || {}).nom, statutActif: S.statut, tjmCible: S.tjm, joursFactures: S.joursFactures };
  if (t === "aujourdhui") {
    const rang = rangActuel(S);
    base.progression = {
      niveau: niveauPour(jeu().xp), xp: nz(jeu().xp), serie: nz(jeu().serie),
      rang: rang.nom, prochainRang: rang.suivant ? rang.suivant.nom : null
    };
    base.phases = PHASES.map((p) => ({ phase: p.n, titre: p.titre, ...phaseStats(p.n) }));
    base.prochainesDemarches = Store.all("checklist").slice().sort((a, b) => nz(a.ordre) - nz(b.ordre))
      .filter((c) => etatCheck(c) === "a_faire").slice(0, 5).map((c) => c.titre);
    base.enAttente = Store.all("checklist").filter((c) => etatCheck(c) === "en_attente")
      .map((c) => ({ titre: c.titre, retourAttenduLe: c.attenduLe }));
    base.relancesDues = Store.all("leads").filter((l) => { const f = leadFlags(l, S); return !f.closed && f.due; })
      .map((l) => ({ nom: l.nom, retardJours: l.prochaineRelance ? daysDiff(todayISO(), l.prochaineRelance) : 0 }));
    base.facturesEchues = Store.all("invoices").filter((i) => !i.dateEncaissement && i.dateEcheance && daysDiff(todayISO(), i.dateEcheance) > 0)
      .map((i) => ({ numero: i.numero, montantHT: i.montantHT, echeance: i.dateEcheance }));
  } else if (t === "prospection") {
    const leads = Store.all("leads");
    base.pistes = leads.map((l) => ({
      nom: l.nom, colonne: (STAGES.find((s) => s.id === l.stage) || {}).nom, source: l.canal, poste: l.poste,
      tjmVise: l.tjmVise, tjmPropose: l.tjmPropose, dernierContact: l.dernierContact, prochaineRelance: l.prochaineRelance
    }));
    base.metriques = metriques(leads);
  } else if (t === "simulateur") {
    const sim = simulate(S);
    base.simulation = Object.fromEntries(Object.keys(sim.statuts).map((k) => [k, {
      netAnnuel: Math.round(sim.statuts[k].net), netMensuel: Math.round(sim.statuts[k].mensuel),
      ecartVsSalaire: sim.statuts[k].ecart === null ? null : Math.round(sim.statuts[k].ecart * 100) + "%"
    }]));
    base.referenceSalarieeNetteApresIR = Math.round(sim.reference.net);
  } else if (t === "demarches") {
    base.checklist = Store.all("checklist").map((c) => ({ phase: c.phase, titre: c.titre, fait: !!c.fait, echeance: c.echeance }));
  } else if (t === "missions") {
    base.missions = Store.all("missions").map((m) => ({ client: m.client, tjm: m.tjm, joursVendus: m.joursVendus, joursConsommes: joursConsommes(m.id), statut: m.statut }));
    base.factures = Store.all("invoices").map((i) => ({ numero: i.numero, montantHT: i.montantHT, echeance: i.dateEcheance, encaissement: i.dateEncaissement || null }));
  } else if (t === "aventure") {
    const e = etatAventure(S);
    base.aventure = {
      jalonsFranchis: e.nbFaits, total: e.total,
      voie: S.statut === "undecided" ? "commune" : S.statut,
      prochain: e.courant >= 0 ? { titre: e.noeuds[e.courant].t, description: e.noeuds[e.courant].d, xp: e.noeuds[e.courant].xp } : null,
      restants: e.noeuds.filter((n, i) => !e.faits[i]).map((n) => n.t),
      choixFaits: {
        statut: S.statut, aide: S.scenarioAide,
        tva: S.assujettiTVA ? "assujetti" : "franchise", canal: S.canalPrincipal || null
      }
    };
  } else if (t === "vitrine") {
    base.projets = Store.all("projects").slice().sort(parOrdre)
      .map((p) => ({ titre: p.titre, resume: p.resume, techs: p.techs, annee: p.annee, statut: p.statut }));
    base.cvEntete = S.cvEntete;
    base.cvBlocs = Store.all("cvBlocks").slice().sort(parOrdre)
      .map((b) => ({ type: b.type, titre: b.titre, sousTitre: b.sousTitre, periode: b.periode, description: b.description }));
    base.sectionsPortfolio = Store.all("siteBlocks").slice().sort(parOrdre)
      .map((b) => ({ type: b.type, titre: b.titre, visible: b.actif !== false }));
  } else if (t === "echeances") {
    base.echeances = genEcheances(S).slice(0, 12).map((e) => ({ date: e.date, libelle: e.libelle }));
    base.tauxProvision = tauxProvision(S);
    base.chargesFixesMensuelles = Store.all("fixedCosts").reduce((a, c) => a + nz(c.montantMensuel), 0);
  }
  return base;
}

function erreurClaude(code) {
  switch (code) {
    case "not_granted": return "Vous avez refusé l'accès à Claude pour cette page.";
    case "rate_limited": return "Trop de demandes d'affilée. Réessayez dans quelques instants.";
    case "prompt_too_large": return "Trop de données à transmettre — réduisez le texte collé.";
    case "invalid_json": return "La réponse n'était pas exploitable. Reformulez en listant une piste par ligne.";
    case "cancelled": return "";
    case "refused": return "Claude n'a pas répondu à cette demande.";
    case "sampling_disabled": case "not_declared": case "capability_disabled": return "L'intégration Claude n'est pas disponible ici.";
    default: return "La réponse a été interrompue. Réessayez.";
  }
}

async function askClaude(mode, texte) {
  const s = state.sample;
  if (!s || state.busy) return;
  const S = Store.settings;
  const ctx = JSON.stringify(contexteOnglet());
  let prompt, wantJSON = false;

  if (mode === "leads") {
    wantJSON = true;
    prompt = "Voici des annonces ou notes de prospection freelance en France.\n"
      + "Réponds UNIQUEMENT par un tableau JSON d'objets {nom, poste, canal, tjmVise, note}.\n"
      + 'Exemple : [{"nom":"ESN Alpha","poste":"Dev .NET","canal":"ESN / sociétés de conseil","tjmVise":550,"note":""}]\n'
      + "`nom` = client final ou intermédiaire. `canal` doit être choisi parmi : "
      + Store.all("channels").map((c) => c.nom).join(", ") + " — ou laissé vide.\n"
      + "`tjmVise` = nombre en euros, 0 si absent. N'invente pas d'entreprise : n'extrais que ce qui figure dans le texte.\n\nTexte :\n" + texte;
  } else if (mode === "semaine") {
    prompt = "Tu es l'assistant d'un développeur qui prépare son passage en freelance en France.\n"
      + "À partir de ces données, dis-lui ce qu'il doit faire cette semaine : relances dues, échéances proches, factures en retard.\n"
      + "Réponse courte, en français, sous forme de liste d'actions concrètes. Pas de conseil juridique ou fiscal présenté comme certain.\n"
      + "Date du jour : " + todayISO() + "\n\nDonnées :\n" + ctx;
  } else if (mode === "approche") {
    const l = state.selectedLead ? Store.get("leads", state.selectedLead) : null;
    const cible = l || Store.all("leads").find((x) => x.stage === "a_contacter");
    if (!cible) { toast("Aucune piste à contacter"); return; }
    prompt = "Rédige un message d'approche court (8 lignes maximum) en français, à envoyer par LinkedIn ou e-mail, "
      + "pour un développeur full-stack .NET Core / Angular / React / Flutter / Azure basé en Île-de-France qui passe en freelance.\n"
      + "Ton : direct, professionnel, sans superlatif ni flatterie. Termine par une proposition d'échange de 15 minutes.\n"
      + "Piste visée : " + JSON.stringify({ nom: cible.nom, poste: cible.poste, canal: cible.canal, tjmVise: cible.tjmVise, note: cible.note });
  } else {
    prompt = "Tu es l'assistant d'un développeur français qui prépare son passage en freelance.\n"
      + "Réponds de façon courte et factuelle, en français, avec le vocabulaire exact des organismes (URSSAF, CFE, TJM, ARE, RC Pro).\n"
      + "Si tu donnes un chiffre, précise qu'il doit être vérifié. Ne présente jamais une estimation comme une règle certaine.\n"
      + "Date du jour : " + todayISO() + "\n\nContexte de l'onglet :\n" + ctx + "\n\nQuestion :\n" + texte;
  }

  state.busy = true;
  state.abort = new AbortController();
  state.chat.push({ role: "user", content: mode === "leads" ? "Ajouter ces pistes :\n" + texte : texte });
  if (!wantJSON) state.chat.push({ role: "assistant", content: "", streaming: true });
  renderDrawer();

  try {
    if (wantJSON) {
      const data = await s.json(prompt, { signal: state.abort.signal, modelTier: "quick" });
      const arr = Array.isArray(data) ? data : [];
      const clean = arr.filter((x) => x && x.nom).slice(0, 25).map((x) => ({
        nom: String(x.nom).slice(0, 120), poste: String(x.poste || "").slice(0, 120),
        canal: String(x.canal || ""), tjmVise: nz(x.tjmVise, 0), note: String(x.note || "").slice(0, 400)
      }));
      state.chat.push({ role: "assistant", content: clean.length ? clean.length + " piste(s) extraite(s) — vérifiez avant d'ajouter." : "Aucune piste identifiable dans ce texte." });
      state.proposals = clean.length ? clean : null;
    } else {
      const res = await s(prompt, {
        signal: state.abort.signal,
        onText: ({ text }) => { const el = $("#streamBubble"); if (el) el.textContent = text; }
      });
      const last = state.chat[state.chat.length - 1];
      last.content = res.text + (res.truncated ? "\n\n(réponse tronquée)" : "");
      delete last.streaming;
    }
  } catch (e) {
    const msg = erreurClaude(e && e.code);
    const last = state.chat[state.chat.length - 1];
    if (last && last.streaming) {
      last.content = (e && e.text) ? e.text + "\n\n— " + msg : msg;
      delete last.streaming;
      if (!last.content) state.chat.pop();
    } else if (msg) state.chat.push({ role: "assistant", content: msg });
  } finally {
    state.busy = false; state.abort = null;
    renderDrawer();
  }
}

/** Recadre la photo en carré et la réduit : une image d'appareil photo pèse
 *  plusieurs mégaoctets, bien au-delà de ce qu'un enregistrement peut contenir. */
function lirePhoto(file, cb) {
  const COTE = 320;
  const fr = new FileReader();
  fr.onerror = () => cb(null);
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => cb(null);
    img.onload = () => {
      try {
        const c = document.createElement("canvas");
        c.width = COTE; c.height = COTE;
        const cote = Math.min(img.width, img.height);
        c.getContext("2d").drawImage(img, (img.width - cote) / 2, (img.height - cote) / 2, cote, cote, 0, 0, COTE, COTE);
        cb(c.toDataURL("image/jpeg", 0.82));
      } catch (_) { cb(null); }
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.role === "photo-file") {
    const file = t.files && t.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast("Ce fichier n'est pas une image"); return; }
    lirePhoto(file, (data) => {
      if (!data) { toast("Image illisible"); return; }
      const box = t.closest(".photo-champ");
      $('input[type="hidden"]', box).value = data;
      const img = $(".photo-vue", box);
      img.src = data; img.hidden = false;
    });
    return;
  }
  if (t.dataset.sfield !== undefined) {
    const k = t.dataset.sfield;
    // Le type du champ décide de la conversion : appliquer Number() à une date
    // produisait NaN, écrit en base comme null, et effaçait la valeur.
    let v;
    if (t.type === "checkbox") v = t.checked;
    else if (t.type === "number") v = t.value === "" ? 0 : Number(t.value);
    else if (t.type === "date" || t.type === "month") {
      v = t.value;
      // Un champ date émet parfois « change » avant que l'année soit complète :
      // on refuse les millésimes aberrants plutôt que d'enregistrer 01/01/0001.
      if (v) { const an = Number(String(v).slice(0, 4)); if (!(an >= 1950 && an <= 2100)) return; }
    } else v = t.value;
    if (typeof v === "number" && !Number.isFinite(v)) return;
    Store.saveSettings({ [k]: v });
    return;
  }
  const act = t.dataset.act;
  if (act === "wd") {
    const { mission, mois } = t.dataset;
    const existing = Store.all("workdays").find((w) => w.missionId === mission && w.mois === mois);
    const v = t.value === "" ? 0 : Number(t.value);
    if (existing) { if (v === 0) Store.remove("workdays", existing.id); else Store.put("workdays", { ...existing, jours: v }); }
    else if (v > 0) Store.put("workdays", { missionId: mission, mois, jours: v });
  } else if (act === "ech-toggle") {
    const key = t.dataset.key, doc = t.dataset.doc;
    if (doc) { const d = Store.get("deadlines", doc); if (d) Store.put("deadlines", { ...d, fait: t.checked }); }
    else if (key) Store.put("deadlines", { key, fait: t.checked, montant: 0 });
  }
});

let sortDrag = null;
function rowApres(cont, y) {
  return $$(".srow:not(.dragging)", cont).find((r) => {
    const b = r.getBoundingClientRect();
    return y < b.top + b.height / 2;
  }) || null;
}
async function persistOrdre(coll, cont) {
  const ids = $$(".srow", cont).map((r) => r.dataset.id);
  for (let i = 0; i < ids.length; i++) {
    const doc = Store.get(coll, ids[i]);
    if (doc && nz(doc.ordre) !== i) await Store.put(coll, { ...doc, ordre: i });
  }
}
document.addEventListener("dragstart", (e) => {
  const row = e.target.closest(".srow");
  if (!row) return;
  const cont = row.closest(".sortable");
  if (!cont) return;
  sortDrag = { id: row.dataset.id, coll: cont.dataset.coll };
  row.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", row.dataset.id); } catch (_) { }
});
document.addEventListener("dragover", (e) => {
  if (!sortDrag) return;
  const cont = e.target.closest(".sortable");
  if (!cont || cont.dataset.coll !== sortDrag.coll) return;
  e.preventDefault();
  const el = $(".srow.dragging", cont);
  if (!el) return;
  const ref = rowApres(cont, e.clientY);
  if (ref) cont.insertBefore(el, ref); else cont.appendChild(el);
});
document.addEventListener("drop", (e) => {
  if (!sortDrag) return;
  const cont = e.target.closest(".sortable");
  if (!cont || cont.dataset.coll !== sortDrag.coll) { sortDrag = null; return; }
  e.preventDefault();
  const coll = sortDrag.coll;
  sortDrag = null;
  $$(".srow.dragging").forEach((r) => r.classList.remove("dragging"));
  persistOrdre(coll, cont);
});
document.addEventListener("dragend", () => {
  $$(".srow.dragging").forEach((r) => r.classList.remove("dragging"));
  sortDrag = null;
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if ($$(".sel-list").some((l) => !l.hidden)) { fermerListes(null); return; }
    if ($("#modalRoot").innerHTML) closeModal();
    else if (state.drawerOpen) { state.drawerOpen = false; renderDrawer(); }
  }
});

/* ============================================================================
   Démarrage
   ========================================================================== */
(function boot() {
  const th = localStorage_get("theme");
  if (th) document.documentElement.setAttribute("data-theme", th);
  render();
  Store.init();
  if (window.claude && window.claude.use) {
    window.claude.use("sample").then((s) => { state.sample = s; renderDrawer(); }).catch(() => { state.sample = null; renderDrawer(); });
  } else {
    state.sample = null;
  }
})();
</script>
