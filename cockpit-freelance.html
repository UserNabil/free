<title>Cockpit Freelance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --ground:#F7F9F4; --surface:#FFFFFF; --surface-2:#F1F4EC; --surface-3:#E7ECE0;
  --ink:#3C3C3C; --ink-2:#777777; --ink-3:#AFAFAF;
  --line:#E5E5E5; --line-strong:#D6D6D6;

  --green:#58CC02; --green-d:#46A302; --green-soft:#E4FBD0;
  --blue:#1CB0F6;  --blue-d:#1899D6;  --blue-soft:#DDF4FF;
  --gold:#FFB020;  --gold-d:#D98D00;  --gold-soft:#FFF1D4;
  --red:#FF4B4B;   --red-d:#D93B3B;   --red-soft:#FFE3E3;
  --purple:#B45DE8;--purple-d:#8F42BF;--purple-soft:#F5E6FF;

  --accent:var(--green); --accent-d:var(--green-d); --accent-ink:#FFFFFF;
  --accent-soft:var(--green-soft); --accent-line:#A8E86B;
  --ok:#3B9E1F; --ok-soft:var(--green-soft);
  --warn:#A66A00; --warn-soft:var(--gold-soft);
  --bad:#D93B3B; --bad-soft:var(--red-soft);

  --shadow:0 2px 0 var(--line);
  --radius:16px;
  --display:"Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --sans:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --mono:"Nunito",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131F24; --surface:#1B2A31; --surface-2:#22343C; --surface-3:#2B4049;
    --ink:#F1F7FB; --ink-2:#B4C7D0; --ink-3:#7E97A3;
    --line:#37464F; --line-strong:#4A6270;
    --green:#61D404; --green-d:#3E8F02; --green-soft:#1F3A16;
    --blue:#49C0F8;  --blue-d:#2A8FC4;  --blue-soft:#12303E;
    --gold:#FFC02E;  --gold-d:#C08800;  --gold-soft:#3A2C0A;
    --red:#FF6B6B;   --red-d:#C74747;   --red-soft:#3D1E1E;
    --purple:#CB8DF5;--purple-d:#8C55BA;--purple-soft:#2A1B39;
    --accent-line:#3E8F02;
    --ok:#61D404; --warn:#FFC02E; --bad:#FF6B6B;
    --shadow:0 2px 0 var(--line);
  }
}
:root[data-theme="dark"]{
  --ground:#131F24; --surface:#1B2A31; --surface-2:#22343C; --surface-3:#2B4049;
  --ink:#F1F7FB; --ink-2:#B4C7D0; --ink-3:#7E97A3;
  --line:#37464F; --line-strong:#4A6270;
  --green:#61D404; --green-d:#3E8F02; --green-soft:#1F3A16;
  --blue:#49C0F8;  --blue-d:#2A8FC4;  --blue-soft:#12303E;
  --gold:#FFC02E;  --gold-d:#C08800;  --gold-soft:#3A2C0A;
  --red:#FF6B6B;   --red-d:#C74747;   --red-soft:#3D1E1E;
  --purple:#CB8DF5;--purple-d:#8C55BA;--purple-soft:#2A1B39;
  --accent-line:#3E8F02;
  --ok:#61D404; --warn:#FFC02E; --bad:#FF6B6B;
  --shadow:0 2px 0 var(--line);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14.5px;font-weight:600;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display);font-weight:700;letter-spacing:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;min-height:100vh}
header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:2px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.brand .logo{font-size:20px;line-height:1}
.brand b{font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.top-spacer{flex:1}

/* HUD de jeu */
.hud{display:flex;align-items:center;gap:9px}
.hud-lvl{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:2px solid var(--line);border-radius:99px;padding:3px 12px 3px 4px;cursor:pointer}
.hud-lvl:hover{background:var(--surface-3)}
.lvl-badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#4A3200;font-family:var(--display);font-weight:800;font-size:14px;line-height:1;border:2px solid var(--gold-d);flex:none}
.hud-xp{display:flex;flex-direction:column;gap:2px;min-width:104px}
.hud-xp .t{font-family:var(--display);font-size:10.5px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;line-height:1}
.hud-streak{display:inline-flex;align-items:center;gap:4px;background:var(--gold-soft);border:2px solid var(--gold);border-radius:99px;padding:3px 11px;font-family:var(--display);font-weight:800;font-size:14px;color:var(--gold-d)}
.hud-streak.off{background:var(--surface-2);border-color:var(--line);color:var(--ink-3)}

.xpbar{height:12px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.xpbar>i{display:block;height:100%;background:var(--green);border-radius:99px;position:relative;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xpbar>i::after{content:"";position:absolute;top:2px;left:5px;right:5px;height:3px;border-radius:99px;background:rgba(255,255,255,.45)}
.xpbar.gold>i{background:var(--gold)}
.xpbar.blue>i{background:var(--blue)}
.xpbar.red>i{background:var(--red)}

.statut-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border:2px solid var(--accent-line);background:var(--accent-soft);color:var(--ok);border-radius:99px;font-family:var(--display);font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer}
.statut-chip.undecided{border-color:var(--line-strong);background:var(--surface-2);color:var(--ink-2)}

.tabs{display:flex;gap:6px;padding:0 12px 9px;overflow-x:auto;scrollbar-width:thin}
.tabs button{background:var(--surface-2);border:2px solid transparent;border-radius:99px;padding:6px 15px;color:var(--ink-2);font-family:var(--display);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tabs button:hover{background:var(--surface-3);color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ok);background:var(--accent-soft);border-color:var(--accent-line)}
main{flex:1;padding:18px 16px 40px;max-width:1180px;width:100%;margin:0 auto}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:14px;
  border:2px solid var(--line-strong);background:var(--surface);cursor:pointer;
  font-family:var(--display);font-size:13.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
  box-shadow:0 3px 0 var(--line-strong);transition:transform .06s,box-shadow .06s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line-strong)}
.btn.primary{background:var(--green);border-color:var(--green-d);box-shadow:0 4px 0 var(--green-d);color:#FFFFFF}
.btn.primary:hover{filter:brightness(1.06);background:var(--green)}
.btn.primary:active{transform:translateY(4px);box-shadow:none}
.btn.blue{background:var(--blue);border-color:var(--blue-d);box-shadow:0 4px 0 var(--blue-d);color:#FFFFFF}
.btn.blue:hover{filter:brightness(1.06);background:var(--blue)}
.btn.gold{background:var(--gold);border-color:var(--gold-d);box-shadow:0 4px 0 var(--gold-d);color:#463000}
.btn.sm{padding:4px 11px;font-size:12px;border-radius:11px;box-shadow:0 2px 0 var(--line-strong)}
.btn.sm:active{transform:translateY(2px);box-shadow:none}
.btn.sm.primary{box-shadow:0 3px 0 var(--green-d)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.ghost:active{transform:none}
.btn.danger{color:var(--bad);border-color:var(--line-strong)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn.block{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:2px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;color:var(--ink-2);box-shadow:0 2px 0 var(--line)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn:active{transform:translateY(2px);box-shadow:none}

/* ---------- primitives ---------- */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:15px}
.panel-b{padding:15px}
.eyebrow{font-family:var(--display);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
.small{font-size:13px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:9px} .wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-family:var(--display);font-size:11.5px;font-weight:700;border:2px solid var(--line-strong);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--ok);border-color:var(--accent-line)}
.pill.warn{background:var(--gold-soft);color:var(--warn);border-color:var(--gold)}
.pill.bad{background:var(--red-soft);color:var(--bad);border-color:var(--red)}
.pill.acc{background:var(--blue-soft);color:var(--blue-d);border-color:var(--blue)}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:13.5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--display);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700;padding:9px 11px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
.tnum{text-align:right;white-space:nowrap}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;padding:9px 11px;border:2px solid var(--line-strong);background:var(--surface);border-radius:12px;font-size:14px;font-weight:600}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none}
input[type=number],input[type=date],input[type=month]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:66px;font-family:inherit}
label.f{display:flex;flex-direction:column;gap:4px}
label.f>span{font-family:var(--display);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700}
.hint{font-size:12px;color:var(--ink-3);line-height:1.35;font-weight:600}
.note{border-left:4px solid var(--line-strong);border-radius:0 8px 8px 0;background:var(--surface-2);padding:9px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.note.warn{border-color:var(--gold);background:var(--gold-soft);color:var(--warn)}
.note.acc{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-d)}
a{color:var(--blue-d);font-weight:700}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.chev{display:inline-block;transition:transform .15s;color:var(--ink-3)}
details[open]>summary .chev{transform:rotate(90deg)}
.bar{height:12px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.bar>i.ok{background:var(--green)} .bar>i.warn{background:var(--gold)} .bar>i.bad{background:var(--red)}
.delta.pos{color:var(--ok)} .delta.neg{color:var(--bad)}

/* ---------- KPI ---------- */
.kpis{display:flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.kpi{flex:1 1 150px;padding:12px 15px;border-right:2px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:23px;font-weight:800;line-height:1.1}
.kpi .k{font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700;margin-top:2px}
.kpi .d{font-size:11.5px;color:var(--ink-3)}

/* ---------- accueil : hero, quêtes, badges ---------- */
.hero{display:flex;align-items:center;gap:16px;padding:18px;border:2px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);flex-wrap:wrap}
.hero-ring{position:relative;width:78px;height:78px;flex:none;display:grid;place-items:center}
.hero-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.hero-ring .lv{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--ok)}
.hero-ring .lb{font-family:var(--display);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.hero-main{flex:1;min-width:210px;display:flex;flex-direction:column;gap:7px}
.hero-main h1{font-size:22px;font-weight:800;line-height:1.15}
.hero-sub{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap}

.quest{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);transition:border-color .2s,background .2s}
.quest.done{border-color:var(--accent-line);background:var(--green-soft)}
.quest-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--surface-2);border:2px solid var(--line)}
.quest.done .quest-ico{background:var(--green);border-color:var(--green-d);color:#fff}
.quest-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.quest-t{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.2}
.quest.done .quest-t{color:var(--ok)}
.quest-xp{font-family:var(--display);font-weight:800;font-size:13px;color:var(--gold-d);background:var(--gold-soft);border:2px solid var(--gold);border-radius:99px;padding:2px 10px;flex:none}
.quest.done .quest-xp{background:var(--green);border-color:var(--green-d);color:#fff}

.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{width:74px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.badge .b-ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:3px solid var(--line);background:var(--surface-2);filter:grayscale(1);opacity:.45}
.badge.on .b-ico{border-color:var(--gold);background:var(--gold-soft);filter:none;opacity:1}
.badge .b-t{font-family:var(--display);font-size:10.5px;font-weight:700;line-height:1.15;color:var(--ink-3)}
.badge.on .b-t{color:var(--ink)}

.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:2px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font:inherit;color:inherit}
.task:first-child{border-top:0}
.task:hover{background:var(--surface-2)}
.task-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none;border:2px solid var(--line);background:var(--surface-2)}
.task-ico.bad{background:var(--red-soft);border-color:var(--red)}
.task-ico.warn{background:var(--gold-soft);border-color:var(--gold)}
.task-ico.acc{background:var(--blue-soft);border-color:var(--blue)}
.task-b{flex:1;min-width:0;display:flex;flex-direction:column}
.task-t{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-d{font-size:11.5px;color:var(--ink-3)}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(238px,1fr);gap:11px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:2px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:110px}
.col.drop{border-color:var(--green);border-style:dashed}
.col-h{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:2px solid var(--line)}
.col-h .t{font-family:var(--display);font-size:12.5px;font-weight:700;flex:1;min-width:0}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 11px;cursor:grab;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 0 var(--line)}
.card:hover{border-color:var(--line-strong)}
.card.late{border-color:var(--red);box-shadow:0 2px 0 var(--red)}
.card.due{border-color:var(--gold);box-shadow:0 2px 0 var(--gold)}
.card.dormant{border-color:var(--line-strong);opacity:.8}
.card .n{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.card .m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-nav{display:flex;gap:4px;margin-left:auto}
.card-nav button{width:24px;height:24px;border:2px solid var(--line);background:var(--surface-2);border-radius:8px;cursor:pointer;font-size:12px;line-height:1;color:var(--ink-2);padding:0;font-weight:800}
.card-nav button:hover{background:var(--green-soft);border-color:var(--accent-line);color:var(--ok)}
.card-nav button[disabled]{opacity:.3;cursor:default}

/* ---------- simulateur ---------- */
.sim{display:grid;grid-template-columns:305px 1fr;gap:16px;align-items:start}
.fields{display:flex;flex-direction:column;gap:12px}
.cmp td.lab{font-size:13px;color:var(--ink-2);white-space:nowrap;font-weight:700}
.cmp tr.hi td{background:var(--green-soft);font-weight:800;color:var(--ink)}
.cmp td.q{font-size:12px;color:var(--ink-2);white-space:normal;min-width:136px;line-height:1.35;font-weight:600}

/* ---------- démarches ---------- */
.phase{border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.phase>summary{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--surface)}
.phase>summary:hover{background:var(--surface-2)}
.phase .pt{font-family:var(--display);font-weight:700;font-size:15px;flex:1;min-width:0}
.phase-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;background:var(--surface-2);border:2px solid var(--line);color:var(--ink-2);flex:none}
.phase-n.on{background:var(--green);border-color:var(--green-d);color:#fff}
.ck{display:flex;align-items:flex-start;gap:11px;padding:11px 15px;border-top:2px solid var(--line)}
.ck-check{width:30px;height:30px;border-radius:50%;border:3px solid var(--line-strong);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:15px;flex:none;padding:0;color:transparent;margin-top:1px}
.ck-check:hover{border-color:var(--green)}
.ck.fait .ck-check{background:var(--green);border-color:var(--green-d);color:#fff}
.ck.attente .ck-check{border-color:var(--gold);border-style:dashed;background:var(--gold-soft);color:var(--gold-d)}
.ck .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ck .t{font-size:13.5px;line-height:1.35;font-weight:700}
.ck.fait .t{color:var(--ink-3);text-decoration:line-through}
.ck .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--surface);border-left:2px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(101%);transition:transform .2s ease}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:2px solid var(--line)}
.drawer-b{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.drawer-f{border-top:2px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:9px}

  settings: null,

  async init() {
    COLLECTIONS.forEach((c) => { this.cache[c] = []; });

      (s) => { if (s.exists) { this.settings = mergeSettings(s.data()); this.ready = true; renderSoon(); } },

    );
    COLLECTIONS.forEach((c) => {
      this.db.collection(c).onSnapshot(
        (qs) => {

        },
        (e) => dbError(e)
      );
    });
  },

        stage: "proposition", tjmVise: 620, tjmPropose: 580, dernierContact: addDays(todayISO(), -1), prochaineRelance: addDays(todayISO(), 4),

    ];
    if (this.mode === "db") {

  loadLocal() {
    let raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch (_) { raw = null; }
    if (!raw) { this.seed(); return; }
    try {
      const d = JSON.parse(raw);
      COLLECTIONS.forEach((c) => { this.cache[c] = Array.isArray(d[c]) ? d[c] : []; });
      this.settings = mergeSettings(d.settings || {});
    } catch (_) { this.seed(); }
  },

  persistLocal() {
    if (this.mode !== "local") return;
    try {
      const payload = { settings: this.settings };
      COLLECTIONS.forEach((c) => { payload[c] = this.cache[c]; });
      localStorage.setItem(LS_KEY, JSON.stringify(payload));
    } catch (_) { /* quota ou stockage bloqué : la session reste utilisable en mémoire */ }
  },

  all(coll) { return this.cache[coll] || []; },
  get(coll, id) { return this.all(coll).find((x) => x.id === id) || null; },

  async put(coll, obj) {
    const rec = { ...obj };
    if (!rec.id) rec.id = uid();
    rec.updatedAt = new Date().toISOString();
    const arr = this.cache[coll];
    const i = arr.findIndex((x) => x.id === rec.id);
    if (i >= 0) arr[i] = rec; else arr.push(rec);
    if (this.mode === "db") { this.db.collection(coll).doc(rec.id).set(rec).catch(dbError); }
    else this.persistLocal();
    renderSoon();
    return rec;
  },

  async remove(coll, id) {
    this.cache[coll] = this.all(coll).filter((x) => x.id !== id);
    if (this.mode === "db") { this.db.collection(coll).doc(id).delete().catch(dbError); }
    else this.persistLocal();
    renderSoon();
  },

  async saveSettings(patch) {
    this.settings = mergeSettings({ ...this.settings, ...patch });
    if (this.mode === "db") { this.db.doc("settings/main").set({ ...this.settings, updatedAt: new Date().toISOString() }).catch(dbError); }
    else this.persistLocal();
    renderSoon();
  },

  async resetContenuDepart() {
    await Promise.all([
      ...this.all("channels").map((c) => this.remove("channels", c.id)),
      ...this.all("checklist").map((c) => this.remove("checklist", c.id))
    ]);
    await this.seedSansBail();
  },

  async seedSansBail() {
    const now = new Date().toISOString();
    const chans = CANAUX_DEPART.map(([nom, categorie], i) => ({ id: uid(), nom, categorie, ordre: i, updatedAt: now }));
    const checks = CHECKLIST_DEPART.map(([phase, titre, organisme, lien, delaiAttente], i) => ({
      id: uid(), phase, titre, organisme, lien, delaiAttente: delaiAttente || 0,
      etat: "a_faire", attenduLe: "", faitLe: "", echeance: "", note: "", ordre: i, updatedAt: now
    }));
    for (const c of chans) await this.put("channels", c);
    for (const c of checks) await this.put("checklist", c);
    toast("Contenu de départ restauré");
  },

  exportJSON() {
    const payload = { _app: "cockpit-freelance", _date: new Date().toISOString(), settings: this.settings };
    COLLECTIONS.forEach((c) => { payload[c] = this.all(c); });
    return JSON.stringify(payload, null, 2);
  },

  async importJSON(text) {
    const d = JSON.parse(text);
    if (!d || typeof d !== "object") throw new Error("format");
    for (const c of COLLECTIONS) {
      if (!Array.isArray(d[c])) continue;
      for (const old of this.all(c).slice()) await this.remove(c, old.id);
      for (const rec of d[c]) await this.put(c, rec);
    }
    if (d.settings) await this.saveSettings(d.settings);
    toast("Données importées");
  }
};

function mergeSettings(s) {
  const out = { ...DEFAULT_SETTINGS, ...(s || {}) };
  out.params = deepMerge(structuredCloneSafe(PARAMS_2026), (s && s.params) || {});
  // `jeu` est toujours recopié : jamais de référence partagée avec DEFAULT_SETTINGS.
  const j = { ...DEFAULT_SETTINGS.jeu, ...((s && s.jeu) || {}) };
  j.badges = Array.isArray(j.badges) ? j.badges.slice() : [];
  j.quetesFaites = Array.isArray(j.quetesFaites) ? j.quetesFaites.slice() : [];
  j.quetesManuelles = Array.isArray(j.quetesManuelles) ? j.quetesManuelles.slice() : [];
  j.journal = { ...(j.journal || {}) };
  out.jeu = j;
  return out;
}
function structuredCloneSafe(o) { return JSON.parse(JSON.stringify(o)); }
function deepMerge(base, over) {
  for (const k of Object.keys(over || {})) {
    if (over[k] && typeof over[k] === "object" && !Array.isArray(over[k]) && base[k] && typeof base[k] === "object") deepMerge(base[k], over[k]);
    else if (over[k] !== undefined) base[k] = over[k];
  }
  return base;
}
function dbError(e) {
  const code = (e && e.code) || "unavailable";
  if (code === "revoked" || code === "not_granted") { Store.mode = "local"; toast("Accès aux données retiré — passage en mode local."); return; }
  if (code === "quota_exceeded") { toast("Base pleine : supprimez d'anciens enregistrements."); return; }
  if (code === "invalid_argument") { toast("Enregistrement refusé (donnée invalide)."); return; }
  toast("Enregistrement momentanément indisponible — réessayez.");
}

/* ============================================================================
   Calculs — simulateur, provisions, échéances
   ========================================================================== */
function irBareme(revenuImposable, parts, bareme) {
  const q = Math.max(0, revenuImposable) / Math.max(1, parts);
  let ir = 0;
  for (const t of bareme) {
    if (q > t.de) ir += (Math.min(q, t.a === null ? Infinity : t.a) - t.de) * t.taux;
  }
  return ir * Math.max(1, parts);
}
/** IR imputable à mon activité : IR du foyer avec, moins IR du foyer sans. */
function irMarginal(revenuImposablePerso, S) {
  const P = S.params, parts = Math.max(1, nz(S.partsFiscales, 1));
  const baseConjoint = Math.max(0, nz(S.revenusConjoint, 0)) * (1 - P.ir.abattementSalaire);
  return Math.max(0, irBareme(baseConjoint + revenuImposablePerso, parts, P.ir.bareme) - irBareme(baseConjoint, parts, P.ir.bareme));
}
function impotSocietes(benefice, P) {
  if (benefice <= 0) return 0;
  return benefice <= P.is.seuil ? benefice * P.is.taux1 : P.is.seuil * P.is.taux1 + (benefice - P.is.seuil) * P.is.taux2;
}

function simulate(S) {
  const P = S.params;
  const CA = nz(S.tjm) * nz(S.joursFactures);
  const frais = nz(S.fraisProAnnuels);
  const out = { CA, frais, statuts: {} };

  /* --- Micro-entreprise (BNC) --- */
  {
    const tauxCot = P.micro.cotisations * (S.acrePremiereAnnee ? 1 - P.micro.acreExoneration : 1);
    const social = CA * tauxCot + CA * P.micro.cfp;
    const baseIR = CA * (1 - P.micro.abattementFiscal);
    const ir = S.versementLiberatoire ? CA * P.micro.versementLiberatoire : irMarginal(baseIR, S);
    const net = CA - social - frais - ir;
    out.statuts.micro = {
      nom: P.micro._libelle, CA, social, is: 0, ir, net,
      depassePlafond: CA > P.micro.plafondCA,
      hypotheses: [
        "Cotisations sociales : " + pct(tauxCot, 1) + " du CA" + (S.acrePremiereAnnee ? " (ACRE : −" + pct(P.micro.acreExoneration, 0) + ")" : "") + " + CFP " + pct(P.micro.cfp, 1) + ".",
        S.versementLiberatoire
          ? "Impôt : versement libératoire " + pct(P.micro.versementLiberatoire, 1) + " du CA (sur option, sous condition de RFR)."
          : "Impôt : barème progressif sur " + pct(1 - P.micro.abattementFiscal, 0) + " du CA (abattement forfaitaire " + pct(P.micro.abattementFiscal, 0) + ").",
        "Les frais professionnels ne sont pas déductibles : ils sortent du net sans réduire l'impôt.",
        CA > P.micro.plafondCA ? "⚠ CA au-dessus du plafond " + eur(P.micro.plafondCA) + " : le régime ne tient pas sur l'année pleine." : null
      ].filter(Boolean)
    };
  }

  /* --- Sociétés à l'IS : hypothèse commune --- */
  const partDiv = clamp(nz(S.partDividendes, 0) / 100, 0, 1);
  const dispo = Math.max(0, CA - frais);

  function societe(kind) {
    const cfg = kind === "eurl" ? P.eurl : P.sasu;
    // ACRE : exonération appliquée aux cotisations du dirigeant la 1re année (approximation).
    const tauxCot = cfg.cotisationsSurNet * (S.acrePremiereAnnee ? 1 - P.micro.acreExoneration : 1);
    const dispoRem = dispo * (1 - partDiv);
    const dispoDiv = dispo * partDiv;
    let remNette = dispoRem / (1 + tauxCot);
    let social = remNette * tauxCot;
    if (kind === "eurl" && social < P.eurl.cotisationsMin) {
      social = P.eurl.cotisationsMin;
      remNette = Math.max(0, dispoRem - social);
    }
    const benefice = Math.max(0, dispoDiv);
    const is = impotSocietes(benefice, P);
    const divBrut = Math.max(0, benefice - is);
    let cotDiv = 0;
    if (kind === "eurl") {
      const seuil = P.eurl.seuilDividendes * nz(S.capitalSocial, 0);
      cotDiv = Math.max(0, divBrut - seuil) * P.eurl.cotisationsDividendes;
    }
    const pfu = Math.max(0, divBrut - cotDiv) * P.pfu;
    const divNet = Math.max(0, divBrut - cotDiv - pfu);
    const irRem = irMarginal(remNette * (1 - P.ir.abattementSalaire), S);
    const net = remNette - irRem + divNet;
    return {
      nom: cfg._libelle, CA, social: social + cotDiv, is,
      ir: irRem + pfu, net,
      hypotheses: [
        "Disponible après frais professionnels : " + eur(dispo) + ".",
        partDiv > 0 ? pct(1 - partDiv, 0) + " en rémunération, " + pct(partDiv, 0) + " en dividendes." : "Tout le disponible est versé en rémunération, aucun dividende.",
        "Cotisations ≈ " + pct(tauxCot, 0) + " de la rémunération nette"
        + (S.acrePremiereAnnee ? " — ACRE appliquée (−" + pct(P.micro.acreExoneration, 0) + "), approximation pour une société" : "")
        + (kind === "eurl" ? " (plancher " + eur(P.eurl.cotisationsMin) + "/an)" : "") + ".",
        partDiv > 0 ? "IS " + pct(P.is.taux1, 0) + " jusqu'à " + eur(P.is.seuil) + " puis " + pct(P.is.taux2, 0) + ", puis PFU " + pct(P.pfu, 1) + " sur les dividendes." : null,
        (kind === "eurl" && partDiv > 0) ? "Cotisations TNS " + pct(P.eurl.cotisationsDividendes, 0) + " sur la part de dividendes dépassant " + pct(P.eurl.seuilDividendes, 0) + " du capital (" + eur(nz(S.capitalSocial)) + ") — approximation." : null,
        "IR au barème sur la rémunération après abattement " + pct(P.ir.abattementSalaire, 0) + "."
      ].filter(Boolean)
    };
  }
  out.statuts.eurl = societe("eurl");
  out.statuts.sasu = societe("sasu");

  /* --- Portage salarial --- */
  {
    const rMin = P.portage.restitutionMin, rMax = P.portage.restitutionMax;
    const rMid = (rMin + rMax) / 2;
    const fraisGestion = CA * nz(S.fraisGestionPortage, P.portage.fraisGestionDefaut);
    const restitue = CA * rMid;
    const imposable = Math.max(0, restitue - frais) * (1 - P.ir.abattementSalaire);
    const ir = irMarginal(imposable, S);
    const net = restitue - frais - ir;
    out.statuts.portage = {
      nom: P.portage._libelle, CA,
      social: Math.max(0, CA - restitue - fraisGestion), is: 0, ir, net,
      fourchette: [CA * rMin - frais, CA * rMax - frais],
      hypotheses: [
        "Taux de restitution net observé " + pct(rMin, 0) + " à " + pct(rMax, 0) + " du CA HT ; le tableau retient la médiane " + pct(rMid, 1) + ".",
        "Frais de gestion " + pct(nz(S.fraisGestionPortage), 1) + " du CA (" + eur(fraisGestion) + ") — inclus dans le taux de restitution observé.",
        "La ligne « prélèvements sociaux » est un résidu déduit du taux de restitution, pas un taux officiel.",
        "IR au barème sur le salaire net après abattement " + pct(P.ir.abattementSalaire, 0) + "."
      ]
    };
  }

  /* --- Référence salariée --- */
  const refBrutNet = nz(S.salaireNetMensuel) * 12;
  const refIR = irMarginal(refBrutNet * (1 - P.ir.abattementSalaire), S);
  out.reference = { netAvantIR: refBrutNet, ir: refIR, net: refBrutNet - refIR };
  for (const k of Object.keys(out.statuts)) {
    const s = out.statuts[k];
    s.mensuel = s.net / 12;
    s.ecart = out.reference.net > 0 ? (s.net - out.reference.net) / out.reference.net : null;
    s.tauxPrelevement = CA > 0 ? (s.social + s.is + s.ir) / CA : 0;
  }
  return out;
}

/** Taux à provisionner sur chaque encaissement, dérivé du simulateur. */
function tauxProvision(S) {
  if (S.statut === "undecided") return null;
  const sim = simulate(S);
  const s = sim.statuts[S.statut];
  return s ? clamp(s.tauxPrelevement, 0, 0.9) : null;
}

/* ---- échéances générées sur 12 mois glissants ---- */
function genEcheances(S) {
  const out = [];
  const start = new Date(); start.setDate(1);
  const st = S.statut;
  const societe = st === "eurl" || st === "sasu";
  const push = (key, date, libelle, cat) => out.push({ key, date, libelle, cat, genere: true });
  for (let i = 0; i < 12; i++) {
    const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
    const y = d.getFullYear(), m = d.getMonth();
    const iso = (yy, mm, dd) => new Date(Date.UTC(yy, mm, dd)).toISOString().slice(0, 10);
    const mm2 = String(m + 1).padStart(2, "0");
    if (st === "micro") {
      if (S.periodiciteUrssaf === "mensuelle") push("urssaf-" + y + "-" + mm2, iso(y, m, 30), "Déclaration et paiement URSSAF (mensuel)", "URSSAF");
      else if ([0, 3, 6, 9].includes(m)) push("urssaf-" + y + "-" + mm2, iso(y, m, 30), "Déclaration et paiement URSSAF (trimestriel)", "URSSAF");
    } else if (st === "portage") {
      // rien à déclarer : la société de portage s'en charge
    } else if (societe) {
      if ([2, 5, 8, 11].includes(m)) push("is-ac-" + y + "-" + mm2, iso(y, m, 15), "Acompte d'impôt sur les sociétés", "IS");
      if (m === 4) push("liasse-" + y, iso(y, 4, 15), "Liasse fiscale (clôture au 31/12)", "IS");
      push("cot-" + y + "-" + mm2, iso(y, m, 5), "Cotisations sociales du dirigeant", "URSSAF");
    }
    if (S.assujettiTVA) push("tva-" + y + "-" + mm2, iso(y, m, 20), "Déclaration de TVA (CA3)", "TVA");
    if (m === 11 && st !== "portage") push("cfe-" + y, iso(y, 11, 15), "CFE — cotisation foncière des entreprises", "CFE");
    if (m === 4) push("ir-" + y, iso(y, 4, 31), "Déclaration de revenus (mai–juin selon département)", "IR");
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

/* ============================================================================
   Aides à la création et projection pluriannuelle
   ========================================================================== */

/** Droits ARE : valeurs réelles du relevé France Travail si saisies, sinon estimation. */
function droitsARE(S) {
  const A = S.params.aides.are;
  if (nz(S.areJournaliere) > 0 && nz(S.areJoursDroits) > 0) {
    return { journaliere: nz(S.areJournaliere), jours: nz(S.areJoursDroits), estime: false };
  }
  const brut = nz(S.salaireBrutAnnuel);
  if (brut <= 0) return { journaliere: 0, jours: 0, estime: true };
  const sjr = brut / 365;
  let j = Math.max(A.tauxSJR * sjr, A.tauxAlt * sjr + A.partieFixe);
  j = Math.max(A.plancher, Math.min(j, A.plafondPartSJR * sjr));
  const jours = Math.max(A.dureeMinJours, Math.round(A.dureeMaxJours * A.coefficientDuree));
  return { journaliere: j, jours, estime: true };
}

/** Réutilise le moteur vérifié `simulate()` pour un CA et une année donnés.
 *  `revenuDeclare` = ce que France Travail retient pour réduire l'allocation :
 *  le revenu d'activité déclaré, pas le net qui reste en poche. */
function simulerStatut(S, statutId, jours, acre) {
  const sim = simulate({ ...S, joursFactures: jours, acrePremiereAnnee: !!acre });
  const s = sim.statuts[statutId] || sim.statuts.micro;
  const revenuDeclare = statutId === "micro"
    ? sim.CA * (1 - S.params.micro.abattementFiscal)
    : Math.max(0, s.net);
  return { CA: sim.CA, social: s.social, is: s.is, ir: s.ir, net: s.net, revenuDeclare };
}

const SCENARIOS = [
  { id: "arce", nom: "ARCE (capital)", court: "ARCE" },
  { id: "maintien", nom: "Maintien de l'ARE (mensuel)", court: "Maintien ARE" },
  { id: "aucune", nom: "Aucune aide", court: "Sans aide" }
];

function projection(S, statutId, scenario) {
  const P = S.params, A = P.aides;
  const are = droitsARE(S);
  const N = clamp(nz(S.horizonAnnees, 4), 1, 6);
  const annees = [];
  let joursRestants = are.jours;
  const arceTotal = are.jours * are.journaliere * A.arce.part;

  for (let y = 1; y <= N; y++) {
    const jours = y === 1 ? nz(S.joursAnnee1, 120) : nz(S.joursFactures, 200);
    const base = simulerStatut(S, statutId, jours, y === 1);
    let aide = 0, aideImposable = 0;
    if (scenario === "arce" && y === 1) {
      aide = arceTotal; joursRestants = 0;
      aideImposable = A.arce.imposable ? aide : 0;
    } else if (scenario === "maintien") {
      const versableAn = Math.max(0, are.journaliere * 365 - A.maintienARE.tauxDeduction * Math.max(0, base.revenuDeclare));
      aide = Math.min(versableAn, joursRestants * are.journaliere);
      joursRestants = Math.max(0, joursRestants - (are.journaliere > 0 ? aide / are.journaliere : 0));
      aideImposable = A.are.imposable ? aide : 0;
    }
    const irAide = aideImposable > 0 ? irMarginal(aideImposable * (1 - P.ir.abattementSalaire), S) : 0;
    annees.push({
      annee: y, jours, CA: base.CA, social: base.social, is: base.is,
      ir: base.ir + irAide, aide, acre: y === 1,
      net: base.net + aide - irAide, joursRestants: Math.round(joursRestants)
    });
  }
  return { annees, are, arceTotal, total: annees.reduce((a, x) => a + x.net, 0) };
}

function comparerScenarios(S, statutId) {
  return SCENARIOS.map((sc) => ({ ...sc, proj: projection(S, statutId, sc.id) }))
    .map((x) => ({ ...x, total: x.proj.total }));
}

/* ============================================================================
   Progression : XP, niveaux, rangs, quêtes, badges
   ========================================================================== */
const XP_GAIN = {
  piste: 5, avance: 10, candidature: 25, echange: 40, proposition: 60, gagne: 200,
  demarcheParPhase: [0, 20, 30, 40, 25], attente: 8, facture: 50
};

function jeu() { return (Store.settings && Store.settings.jeu) || DEFAULT_SETTINGS.jeu; }
const seuilNiveau = (n) => 50 * n * (n + 1);
function niveauPour(xp) { let n = 1; while (nz(xp) >= seuilNiveau(n) && n < 99) n++; return n; }
function progressionNiveau(xp) {
  const n = niveauPour(xp), bas = n === 1 ? 0 : seuilNiveau(n - 1), haut = seuilNiveau(n);
  return { niveau: n, bas, haut, pct: clamp((nz(xp) - bas) / (haut - bas), 0, 1), reste: Math.max(0, haut - nz(xp)) };
}

function etatCheck(c) { return c.etat || (c.fait ? "fait" : "a_faire"); }
function checkFait(fragment) {
  const f = fragment.toLowerCase();
  return Store.all("checklist").some((c) => etatCheck(c) === "fait" && (c.titre || "").toLowerCase().includes(f));
}
function phaseStats(n) {
  const li = Store.all("checklist").filter((c) => nz(c.phase) === n);
  return { total: li.length, faits: li.filter((c) => etatCheck(c) === "fait").length, attente: li.filter((c) => etatCheck(c) === "en_attente").length };
}

  { n: 1, nom: "Salarié en veille", desc: "Vous explorez l'idée." },
  { n: 2, nom: "En préparation", desc: "Phase 1 entamée.", cond: () => phaseStats(1).faits > 0 },
  { n: 3, nom: "Décidé", desc: "Statut choisi et phase 1 bouclée.", cond: (S) => S.statut !== "undecided" && phaseStats(1).total > 0 && phaseStats(1).faits === phaseStats(1).total },
  { n: 4, nom: "En négociation", desc: "Rupture conventionnelle engagée.", cond: () => phaseStats(2).faits > 0 },
  { n: 5, nom: "Immatriculé", desc: "SIRET en poche.", cond: () => checkFait("Obtention du SIRET") },
  { n: 6, nom: "Freelance lancé", desc: "Première mission signée.", cond: () => Store.all("missions").length > 0 },
  { n: 7, nom: "Freelance confirmé", desc: "Premier encaissement reçu.", cond: () => Store.all("invoices").some((i) => i.dateEncaissement) }
];
function rangActuel(S) {
  let r = RANGS[0];
  for (const x of RANGS) { if (!x.cond || x.cond(S)) r = x; }
  return { ...r, suivant: RANGS[RANGS.indexOf(r) + 1] || null };
}

/* --- quêtes du jour : tirées de la situation réelle, stables sur la journée --- */
function graineJour(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function melangeStable(arr, graine) {
  const a = arr.slice(); let g = graine || 1;
  for (let i = a.length - 1; i > 0; i--) { g = (g * 1103515245 + 12345) >>> 0; const j = g % (i + 1);[a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function quetesDuJour(S) {
  const t = todayISO();
  const leads = Store.all("leads"), checks = Store.all("checklist");
  const manuelles = jeu().quetesManuelles || [];
  const pool = [];
  const dues = leads.filter((l) => { const f = leadFlags(l, S); return !f.closed && f.due; }).length;
  if (dues > 0) pool.push({ id: "relance", ico: "📞", t: "Relancer " + Math.min(3, dues) + " piste" + (dues > 1 ? "s" : "") + " en retard", cible: Math.min(3, dues), xp: 30, mesure: () => leads.filter((l) => l.dernierContact === t).length });
  pool.push({ id: "candidature", ico: "📤", t: "Envoyer 1 candidature", cible: 1, xp: 50, mesure: () => leads.filter((l) => (l.stageDates || {}).envoyee === t).length });
  if (checks.some((c) => etatCheck(c) !== "fait")) pool.push({ id: "demarche", ico: "✅", t: "Cocher 1 démarche", cible: 1, xp: 40, mesure: () => checks.filter((c) => c.faitLe === t).length });
  pool.push({ id: "pistes", ico: "🔍", t: "Ajouter 2 nouvelles pistes", cible: 2, xp: 25, mesure: () => leads.filter((l) => l.creeLe === t).length });
  const echues = Store.all("invoices").filter((i) => !i.dateEncaissement && i.dateEcheance && daysDiff(t, i.dateEcheance) > 0).length;
  if (echues > 0) pool.push({ id: "facture", ico: "💶", t: "Relancer une facture échue", cible: 1, xp: 35, manuel: true });
  if (Store.all("missions").length) pool.push({ id: "jours", ico: "📅", t: "Mettre à jour mes jours travaillés", cible: 1, xp: 20, manuel: true });
  if (nz(S.areJournaliere) === 0) pool.push({ id: "are", ico: "🧮", t: "Saisir mes droits ARE réels dans les réglages", cible: 1, xp: 60, manuel: true });

  const choisies = pool.length <= 3 ? pool : melangeStable(pool, graineJour(t)).slice(0, 3);
  return choisies.map((q) => {
    const v = q.manuel ? (manuelles.includes(t + ":" + q.id) ? q.cible : 0) : Math.min(q.mesure(), q.cible);
    return { ...q, valeur: v, fini: v >= q.cible };
  });
}

/* --- attribution d'XP : mise en file pour ne jamais perdre un gain simultané --- */
let fileXP = Promise.resolve();
function gagnerXP(montant, libelle) {
  fileXP = fileXP.then(() => gagnerXPInterne(montant, libelle)).catch(() => { });
  return fileXP;
}
async function gagnerXPInterne(montant, libelle) {
  if (!montant) return;
  {
    const j = { ...jeu() };
    const avant = niveauPour(j.xp);
    j.xp = nz(j.xp) + montant;
    const t = todayISO();
    if (j.dernierJour !== t) {
      j.serie = (j.dernierJour && daysDiff(t, j.dernierJour) === 1) ? nz(j.serie) + 1 : 1;
      j.dernierJour = t;
      j.serieMax = Math.max(nz(j.serieMax), j.serie);
    }
    const journal = { ...(j.journal || {}) };
    journal[t] = nz(journal[t]) + montant;
    j.journal = Object.fromEntries(Object.keys(journal).sort().slice(-30).map((k) => [k, journal[k]]));
    await Store.saveSettings({ jeu: j });
    const apres = niveauPour(j.xp);
    if (apres > avant) { celebrer(); toastJeu("Niveau " + apres + " atteint !", "win"); }
    else toastJeu("+" + montant + " XP" + (libelle ? " · " + libelle : ""), "xp");
  }
}

/** Vérifie quêtes terminées et badges débloqués. Idempotent. */
let verifEnCours = false;
async function verifierProgression() {
  if (verifEnCours || !Store.ready || Store.settings === null) return;
  verifEnCours = true;
  try {
    const S = Store.settings, t = todayISO();
    const j = { ...jeu() };
    const faites = (j.quetesFaites || []).slice();
    let gain = 0; const libelles = [];
    for (const q of quetesDuJour(S)) {
      const cle = t + ":" + q.id;
      if (q.fini && !faites.includes(cle)) { faites.push(cle); gain += q.xp; libelles.push(q.t); }
    }
    const badges = (j.badges || []).slice(); const nouveaux = [];
    for (const b of BADGES) {
      if (!badges.includes(b.id)) { let ok = false; try { ok = !!b.test(S); } catch (_) { ok = false; }
        if (ok) { badges.push(b.id); nouveaux.push(b); } }
    }
    if (!gain && !nouveaux.length) return;
    j.quetesFaites = faites.slice(-60);
    j.badges = badges;
    await Store.saveSettings({ jeu: j });
    if (gain) await gagnerXP(gain, libelles.length === 1 ? "quête terminée" : libelles.length + " quêtes");
    if (nouveaux.length) { celebrer(); toastJeu(nouveaux[0].ico + " Badge : " + nouveaux[0].t, "win"); }
  } finally { verifEnCours = false; }
}

function toastJeu(msg, kind) {
  const r = $("#toastRoot");
  r.innerHTML = '<div class="toast ' + (kind || "") + ' pop">' + esc(msg) + "</div>";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { r.innerHTML = ""; }, 2800);
}
function celebrer() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const root = $("#fxRoot"); if (!root) return;
  const couleurs = ["var(--green)", "var(--gold)", "var(--blue)", "var(--purple)", "var(--red)"];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 26; i++) {
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.left = (10 + Math.random() * 80) + "%";
    d.style.top = (10 + Math.random() * 18) + "%";
    d.style.background = couleurs[i % couleurs.length];
    d.style.animationDelay = (Math.random() * 0.25) + "s";
    frag.appendChild(d);
  }
  root.appendChild(frag);
  setTimeout(() => { root.innerHTML = ""; }, 1900);
}

function anneauNiveau(pct, niveau) {
  const r = 32, c = 2 * Math.PI * r;
  return '<div class="hero-ring"><svg viewBox="0 0 78 78" width="78" height="78" aria-hidden="true">'
    + '<circle cx="39" cy="39" r="' + r + '" fill="none" stroke="var(--surface-3)" stroke-width="7"></circle>'
    + '<circle cx="39" cy="39" r="' + r + '" fill="none" stroke="var(--green)" stroke-width="7" stroke-linecap="round"'
    + ' stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - pct)).toFixed(1) + '"></circle></svg>'
    + '<div style="text-align:center;line-height:1"><div class="lv">' + niveau + '</div><div class="lb">niveau</div></div></div>';
}

  return Store.all("checklist").slice().sort((a, b) => nz(a.ordre) - nz(b.ordre))

}

    + '<span class="pill">' + obtenus.length + " / " + BADGES.length + "</span></div>"

    + BADGES.map((b) => '<div class="badge' + (obtenus.includes(b.id) ? " on" : "") + '" title="' + esc(b.t) + '">'
      + '<span class="b-ico">' + b.ico + '</span><span class="b-t">' + esc(b.t) + "</span></div>").join("")
    + "</div></div></div>";

  return '<div class="stack">' + hero + blocQuetes
    + '<div class="grid-2">' + blocJour + blocAttente + "</div>"
    + blocSituation + blocBadges + "</div>";
};

/* ---------------------------------------------------------------- 1. PROSPECTION */
function leadFlags(l, S) {
  const t = todayISO();
  const closed = l.stage === "gagne" || l.stage === "perdu";
  const retard = !closed && l.prochaineRelance ? daysDiff(t, l.prochaineRelance) : null;
  const dormant = !closed && l.dernierContact && daysDiff(t, l.dernierContact) >= nz(S.seuilDormance, 7);
  return { closed, retard, due: retard !== null && retard >= 0, late: retard !== null && retard > 0, dormant };
}

function metriques(leads) {
  const mois = monthISO(new Date());
  const reached = (l, stage) => {
    const sd = l.stageDates || {};
    if (sd[stage]) return true;
    return STAGE_IDX[l.stage] >= STAGE_IDX[stage] && l.stage !== "perdu" ? true : (STAGE_IDX[l.stage] >= STAGE_IDX[stage]);
  };
  const envoyeesCeMois = leads.filter((l) => (l.stageDates || {}).envoyee && (l.stageDates.envoyee || "").slice(0, 7) === mois).length;
  const nbEnvoyees = leads.filter((l) => reached(l, "envoyee")).length;
  const nbEchange = leads.filter((l) => reached(l, "echange")).length;
  const nbProp = leads.filter((l) => reached(l, "proposition")).length;
  const proposes = leads.map((l) => nz(l.tjmPropose)).filter((v) => v > 0);
  return {
    envoyeesCeMois,
    tauxReponse: nbEnvoyees ? nbEchange / nbEnvoyees : null,
    tauxProposition: nbEchange ? nbProp / nbEchange : null,
    tjmMoyen: proposes.length ? proposes.reduce((a, b) => a + b, 0) / proposes.length : null
  };
}

VIEWS.prospection = function (S) {
  const leads = Store.all("leads");
  const m = metriques(leads);
  const aFaire = leads.map((l) => ({ l, f: leadFlags(l, S) }))
    .filter((x) => !x.f.closed && (x.f.due || x.f.dormant))

  const bandeau = '<section class="today">'
    + '<div class="panel-h" style="border-bottom:0">'
    + '<h2>À faire aujourd\'hui</h2>'

    + '<div style="flex:1"></div>'
    + '<button class="btn sm primary" data-act="lead-new">+ Piste</button>'
    + "</div>"
    + (aFaire.length
      ? aFaire.slice(0, 6).map(({ l, f }) =>
        '<button class="today-row" data-act="lead-edit" data-id="' + l.id + '">'
        + '<span class="pill ' + (f.late ? "bad" : f.due ? "warn" : "") + '">'

        + '<span class="nm">' + esc(l.nom) + "</span>"

        + "</button>").join("")
      : '<div class="empty" style="border-top:1px solid var(--line)">Aucune relance due. Les pistes sans mouvement depuis '
        + nz(S.seuilDormance, 7) + " jours apparaîtront ici comme dormantes.</div>")
    + (aFaire.length > 6 ? '<div class="xs dim" style="padding:6px 12px;border-top:1px solid var(--line)">+ ' + (aFaire.length - 6) + " autres</div>" : "")
    + "</section>";

  const kpis = '<div class="kpis">'
    + kpi(String(m.envoyeesCeMois), "Candidatures ce mois", "")

      + '<div class="col-h"><span class="t">' + esc(st.nom) + '</span><span class="pill">' + items.length + "</span></div>"
      + '<div class="col-b">'
      + items.map((l) => {
        const f = leadFlags(l, S);
        const cls = f.closed ? "" : f.late ? " late" : f.due ? " due" : f.dormant ? " dormant" : "";
        const i = STAGE_IDX[l.stage];
        return '<div class="card' + cls + '" draggable="true" data-id="' + l.id + '">'
          + '<div class="n" data-act="lead-edit" data-id="' + l.id + '">' + esc(l.nom) + "</div>"
          + (l.poste ? '<div class="xs dim">' + esc(l.poste) + "</div>" : "")
          + '<div class="m">'
          + (l.canal ? '<span class="pill">' + esc(l.canal) + "</span>" : "")
          + (nz(l.tjmPropose) > 0 ? '<span class="pill acc">' + eur(l.tjmPropose) + "</span>"
            : nz(l.tjmVise) > 0 ? '<span class="pill">cible ' + eur(l.tjmVise) + "</span>" : "")
          + (!f.closed && f.dormant && !f.due ? '<span class="pill">dormante</span>' : "")
          + '<span class="card-nav">'
          + '<button data-act="lead-move" data-id="' + l.id + '" data-dir="-1"' + (i === 0 ? " disabled" : "") + ' aria-label="Reculer">&#8249;</button>'
          + '<button data-act="lead-move" data-id="' + l.id + '" data-dir="1"' + (i === STAGES.length - 1 ? " disabled" : "") + ' aria-label="Avancer">&#8250;</button>'
          + "</span></div>"
          + (l.prochaineRelance && !f.closed ? '<div class="xs dim num">relance ' + fmtDate(l.prochaineRelance) + "</div>" : "")
          + "</div>";
      }).join("")
      + (items.length ? "" : '<div class="xs dim" style="padding:6px 2px">—</div>')
      + "</div></div>";
  }).join("") + "</div>";

  const canaux = Store.all("channels").slice().sort((a, b) => (a.categorie || "").localeCompare(b.categorie || "") || nz(a.ordre) - nz(b.ordre));
  const parCat = {};
  canaux.forEach((c) => { (parCat[c.categorie || "Autres"] = parCat[c.categorie || "Autres"] || []).push(c); });
  const registre = '<details class="panel" id="regCanaux"' + (localStorage_get("regOpen") === "1" ? " open" : "") + ">"
    + '<summary class="panel-h"><span class="chev">&#9656;</span><h2>Registre des canaux</h2>'
    + '<span class="xs dim" style="flex:1">où investir mon temps — à valider par mes propres chiffres</span>'
    + '<span class="btn sm" data-act="canal-new">+ Canal</span></summary>'
    + '<div class="scroll-x"><table><thead><tr><th>Canal</th><th>Catégorie</th><th class="tnum">Pistes</th><th class="tnum">Gagnées</th><th class="tnum">Taux</th><th></th></tr></thead><tbody>'
    + Object.keys(parCat).map((cat) => parCat[cat].map((c) => {
      const li = Store.all("leads").filter((l) => l.canal === c.nom);
      const g = li.filter((l) => l.stage === "gagne").length;
      return "<tr>"
        + "<td>" + esc(c.nom) + "</td>"
        + '<td class="xs dim">' + esc(c.categorie || "") + "</td>"
        + '<td class="tnum">' + li.length + "</td>"
        + '<td class="tnum">' + g + "</td>"
        + '<td class="tnum">' + (li.length ? pct(g / li.length, 0) : "—") + "</td>"
        + '<td class="tnum"><button class="btn sm ghost" data-act="canal-edit" data-id="' + c.id + '">Modifier</button></td>'
        + "</tr>";
    }).join("")).join("")
    + "</tbody></table></div>"
    + '<div class="panel-b"><p class="note">Ces canaux sont des entrées à mesurer, pas des recommandations. Avant de solliciter les clients de votre employeur actuel, vérifiez les clauses de non-concurrence et de non-sollicitation de votre contrat — l\'item est en phase 1 des Démarches.</p></div>'
    + "</details>";

  return '<div class="stack">'
    + (hasExemples ? '<div class="panel" style="border-color:var(--accent-line);background:var(--accent-soft)"><div class="panel-b row wrap" style="gap:10px"><span class="small" style="flex:1">Trois pistes d\'exemple sont chargées pour montrer le fonctionnement du kanban.</span><button class="btn sm" data-act="del-exemples">Supprimer les exemples</button></div></div>' : "")
    + bandeau + kpis + kanban + registre
    + "</div>";
};

function kpi(v, k, d) {
  return '<div class="kpi"><div class="v">' + esc(v) + '</div><div class="k">' + esc(k) + "</div>"
    + (d ? '<div class="d">' + esc(d) + "</div>" : "") + "</div>";
}
function localStorage_get(k) { try { return localStorage.getItem("cf-ui-" + k); } catch (_) { return null; } }
function localStorage_set(k, v) { try { localStorage.setItem("cf-ui-" + k, v); } catch (_) { } }

/* --- projection pluriannuelle : que rapporte réellement l'année 1, puis les suivantes --- */
function blocProjection(S) {
  const statut = S.statut === "undecided" ? "micro" : S.statut;
  const are = droitsARE(S);
  const scenario = S.scenarioAide || "arce";
  const comp = comparerScenarios(S, statut);
  const proj = (comp.find((c) => c.id === scenario) || comp[0]).proj;
  const meilleur = comp.slice().sort((a, b) => b.total - a.total)[0];
  const maxNet = Math.max(1, ...proj.annees.map((a) => Math.max(0, a.net)));
  const N = proj.annees.length;

  if (are.journaliere <= 0) {
    return '<div class="panel"><div class="panel-h"><h2>Projection sur plusieurs années</h2></div>'
      + '<div class="panel-b"><p class="note warn">Pour projeter vos revenus avec les aides, renseignez votre <b>salaire brut annuel</b> '
      + "(estimation) ou, bien mieux, votre <b>ARE journalière</b> et vos <b>jours de droits</b> relevés sur France Travail. "
      + 'Les deux champs sont dans « Aides et projection pluriannuelle », à gauche.</p></div></div>';
  }

  const selecteur = SCENARIOS.map((sc) =>
    '<button class="btn sm' + (sc.id === scenario ? " primary" : "") + '" data-act="scenario" data-id="' + sc.id + '">' + esc(sc.court) + "</button>").join("");

  const lignes = proj.annees.map((a) => {
    const w = Math.round(Math.max(0, a.net) / maxNet * 100);
    return "<tr>"
      + '<td style="white-space:nowrap"><b>Année ' + a.annee + "</b>"
      + (a.acre ? ' <span class="pill ok">ACRE</span>' : "") + "</td>"
      + '<td class="tnum">' + num(a.jours) + " j</td>"
      + '<td class="tnum">' + eur(a.CA) + "</td>"
      + '<td class="tnum">− ' + eur(a.social + a.is) + "</td>"
      + '<td class="tnum">− ' + eur(a.ir) + "</td>"
      + '<td class="tnum">' + (a.aide > 0 ? '<span class="delta pos">+ ' + eur(a.aide) + "</span>" : "—") + "</td>"
      + '<td style="min-width:150px"><div class="row" style="gap:8px">'
      + '<div class="bar" style="flex:1"><i style="width:' + w + '%"></i></div>'
      + '<b class="num" style="min-width:74px;text-align:right">' + eur(a.net) + "</b></div></td>"
      + "</tr>";
  }).join("");

  const comparatif = '<div class="scroll-x"><table><thead><tr><th>Scénario sur ' + N + " ans</th>"
    + proj.annees.map((a) => '<th class="tnum">An ' + a.annee + "</th>").join("")
    + '<th class="tnum">Total net</th><th></th></tr></thead><tbody>'
    + comp.map((c) => "<tr" + (c.id === scenario ? ' class="hi"' : "") + ">"
      + "<td>" + esc(c.nom) + "</td>"
      + c.proj.annees.map((a) => '<td class="tnum">' + eur(a.net) + "</td>").join("")
      + '<td class="tnum"><b>' + eur(c.total) + "</b></td>"
      + '<td class="tnum">' + (c.id === meilleur.id ? '<span class="pill ok">le plus élevé</span>'
        : '<span class="xs dim num">− ' + eur(meilleur.total - c.total) + "</span>") + "</td></tr>").join("")
    + "</tbody></table></div>";

  return '<div class="panel"><div class="panel-h"><h2>Projection sur plusieurs années</h2>'
    + '<span class="xs dim" style="flex:1">statut retenu : ' + esc((STATUTS.find((x) => x.id === statut) || {}).nom || statut)
    + (S.statut === "undecided" ? " (par défaut, aucun statut n'est arrêté)" : "") + "</span>"
    + '<span class="row" style="gap:5px">' + selecteur + "</span></div>"
    + '<div class="kpis" style="border:0;border-bottom:2px solid var(--line);border-radius:0">'
    + kpi(eur(are.journaliere) + " / j", "ARE journalière", are.estime ? "estimée — à confirmer" : "relevé France Travail")
    + kpi(num(are.jours) + " j", "Droits restants", "soit " + eur(are.jours * are.journaliere) + " au total")
    + kpi(eur(proj.arceTotal), "ARCE si demandée", pct(S.params.aides.arce.part, 0) + " du reliquat, en 2 versements")
    + kpi(eur(proj.total), "Net cumulé sur " + N + " ans", esc((SCENARIOS.find((x) => x.id === scenario) || {}).court))
    + "</div>"
    + '<div class="scroll-x"><table><thead><tr><th>Période</th><th class="tnum">Jours</th><th class="tnum">CA HT</th>'
    + '<th class="tnum">Cotisations + IS</th><th class="tnum">Impôt</th><th class="tnum">Aide perçue</th><th>Net disponible</th></tr></thead><tbody>'

    + '<div class="panel-b" style="border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px">'
    + '<div class="eyebrow">Comparaison des trois scénarios</div>' + comparatif
    + '<p class="note warn"><b>Le choix entre ARCE et maintien de l\'ARE est définitif.</b> L\'ARCE verse '
    + pct(S.params.aides.arce.part, 0) + " du reliquat de vos droits en capital (2 versements, le second "
    + S.params.aides.arce.moisSecondVersement + " mois après le premier) et solde vos droits ; le maintien verse une allocation mensuelle "
    + "réduite de " + pct(S.params.aides.maintienARE.tauxDeduction, 0) + " de vos revenus d'activité, mais conserve vos droits plus longtemps. "
    + "L'ARCE est la plus intéressante quand l'activité démarre vite, le maintien quand elle démarre lentement.</p>"
    + '<p class="note">Hypothèses : année 1 à ' + num(nz(S.joursAnnee1)) + " jours facturés puis " + num(nz(S.joursFactures))
    + " jours par an ; ACRE appliquée la 1re année uniquement ; l'ARE est imposable, le traitement fiscal de l'ARCE "
    + (S.params.aides.arce.imposable ? "est traité comme imposable" : "est traité comme non imposable")
    + " — <b>ce point est à confirmer par un expert-comptable</b>. Le maintien déduit "
    + pct(S.params.aides.maintienARE.tauxDeduction, 0) + " du revenu d'activité <i>déclaré</i> (en micro-entreprise, le CA après abattement), "
    + "sur une base annuelle alors que France Travail liquide mois par mois : sur une activité irrégulière, le résultat réel sera plus favorable que cette moyenne.</p>"
    + (are.estime ? '<p class="note bad" style="border-color:var(--red);background:var(--red-soft);color:var(--bad)">L\'ARE affichée est une <b>estimation</b> calculée à partir de votre salaire brut. '
      + "Le montant réel dépend de votre relevé de situation France Travail, du différé d'indemnisation lié à votre indemnité de rupture et du délai d'attente. "
      + "Faites la simulation officielle avant de vous appuyer sur ces chiffres.</p>" : "")
    + "</div></div>";
}
